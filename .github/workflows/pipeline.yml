# A BACKUP clock for the FM → channels pipeline (api/pipeline.js?op=tick). The main clock is cron-job.org,
# every minute; Vercel's daily cron (vercel.json) is a third. This one runs every 30 minutes: the repo is
# private, where Actions minutes are counted (2,000 a month free) — 48 short runs a day stay far inside that,
# a run every 5 minutes would not. GitHub may start a scheduled run late; nothing is lost, every tick
# catches up on all that is due.
#
# GitHub turns scheduled workflows off after 60 days without a commit to the repo; Actions → Enable turns
# this one back on.
name: pipeline-tick
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency: { group: pipeline-tick, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one pipeline tick
        env:
          URL: https://aiko-social-distribution-check.vercel.app/api/pipeline?op=tick
          KEY: ${{ secrets.PIPELINE_KEY }}
        run: |
          u="$URL"; [ -n "$KEY" ] && u="$u&key=$KEY"
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 150 "$u") || code=000
            echo "attempt $i: HTTP $code"; cat out.json; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
