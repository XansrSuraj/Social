<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko — official websites & social channels</title>
<meta name="description" content="The internal directory of every official website and social media channel, always up to date.">
<meta name="theme-color" content="#5b6bff">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Aiko">
<meta property="og:description" content="Every official website and social channel in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b6bff'/%3E%3Cpath d='M9 21l7-13 7 13z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@13/font/simple-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ═══════════════ tokens ═══════════════ */
:root{
  --a1:#5b6bff; --a2:#a855f7;
  --bg:#f7f8fb; --bg-tint:#eef0f8;
  --surf:#ffffff; --surf2:#f6f7fb; --surf3:#eef0f6;
  --glass:rgba(255,255,255,.75);
  --tx:#0b0e18; --tx2:#5a6280; --tx3:#9aa1bb;
  --ln:#e7e9f2; --ln2:#f0f1f7;
  --red:#e0342c; --amb:#d97706; --grn:#0f9d58;
  --s1:0 1px 2px rgba(12,17,40,.05);
  --s2:0 1px 3px rgba(12,17,40,.05),0 10px 26px -14px rgba(12,17,40,.2);
  --s3:0 2px 8px rgba(12,17,40,.06),0 26px 60px -24px rgba(12,17,40,.3);
  --s4:0 40px 90px -30px rgba(12,17,40,.45);
  --rl:20px; --rm:14px; --rs:10px;
}
html[data-theme="dark"]{
  --bg:#070810; --bg-tint:#0c0e18;
  --surf:#101320; --surf2:#161a2a; --surf3:#1d2234;
  --glass:rgba(14,17,28,.78);
  --tx:#f0f2fa; --tx2:#98a0bd; --tx3:#69708c;
  --ln:#212639; --ln2:#191d2c;
  --red:#ff6b63; --amb:#fbbf24; --grn:#3ddc84;
  --s1:0 1px 2px rgba(0,0,0,.35);
  --s2:0 1px 3px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.75);
  --s3:0 2px 10px rgba(0,0,0,.35),0 30px 70px -28px rgba(0,0,0,.9);
  --s4:0 40px 100px -30px rgba(0,0,0,1);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","tnum";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--a1) 28%,transparent)}
.gt{background:linear-gradient(100deg,var(--a1),var(--a2) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ambient light */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.28}
html[data-theme="dark"] .aura i{opacity:.2}
.aura i:nth-child(1){width:44vw;height:44vw;background:var(--a1);top:-16vw;left:-10vw;animation:dr1 24s ease-in-out infinite}
.aura i:nth-child(2){width:36vw;height:36vw;background:var(--a2);top:4vw;right:-12vw;animation:dr2 28s ease-in-out infinite}
@keyframes dr1{50%{transform:translate(5vw,6vw) scale(1.15)}}
@keyframes dr2{50%{transform:translate(-6vw,8vw) scale(.9)}}
@media(prefers-reduced-motion:reduce){.aura i{animation:none}}

/* ═══════════════ buttons ═══════════════ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;
  border-radius:11px;font-weight:600;font-size:13.5px;letter-spacing:-.1px;white-space:nowrap;
  background:var(--surf2);border:1px solid var(--ln);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.35),box-shadow .18s,background .18s,border-color .18s,color .18s}
.b:hover{transform:translateY(-1.5px);box-shadow:var(--s1);border-color:color-mix(in srgb,var(--a1) 42%,var(--ln))}
.b:active{transform:translateY(0) scale(.97)}
.b.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px -9px color-mix(in srgb,var(--a1) 90%,transparent)}
.b.p:hover{box-shadow:0 14px 32px -11px color-mix(in srgb,var(--a1) 95%,transparent)}
.b.g{background:none;border-color:transparent;color:var(--tx2)}
.b.g:hover{background:var(--surf2);color:var(--tx);border-color:var(--ln)}
.b.d{color:var(--red)}
.b.d:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.b.s{padding:6px 11px;font-size:12.5px;border-radius:9px;gap:5px}
.b.i{padding:0;width:32px;height:32px;border-radius:9px;flex:none}
.b.i.s{width:28px;height:28px;border-radius:8px}
.b.xl{padding:13px 22px;font-size:15px;border-radius:13px}
.b[disabled]{opacity:.4;pointer-events:none}
.b svg{width:15px;height:15px;flex:none}
.b.xl svg{width:17px;height:17px}
.b.i.s svg{width:13px;height:13px}

/* ═══════════════ topbar ═══════════════ */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:11px;padding:11px 20px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.7);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16.5px;letter-spacing:-.4px}
.brand .m{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 5px 16px -6px color-mix(in srgb,var(--a1) 90%,transparent)}
.brand .m svg{width:16px;height:16px}
.beta{flex:none;display:inline-flex;align-items:center;font:800 10px/1 "Inter",system-ui,sans-serif;
  letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:3.5px 8px 3px;border-radius:7px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 5px 14px -6px color-mix(in srgb,var(--a1) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.25);
  transform:translateY(-9px) rotate(-3deg)}
@media(max-width:900px){.beta{transform:translateY(-7px) rotate(-3deg);font-size:9px;padding:3px 6px 2.5px}}
.sp{flex:1}
.sbox{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--ln);
  border-radius:999px;padding:8px 14px;min-width:210px;transition:.2s}
.sbox:focus-within{border-color:var(--a1);background:var(--surf);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
.sbox input{background:none;border:0;outline:none;width:100%;min-width:0;font-size:14px}
.sbox svg{width:15px;height:15px;color:var(--tx3);flex:none}
.kb{font:600 10.5px/1 ui-monospace,monospace;color:var(--tx3);border:1px solid var(--ln);border-radius:5px;padding:3px 5px;background:var(--surf);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:6px 11px;
  border-radius:999px;border:1px solid var(--ln);background:var(--surf2);color:var(--tx2)}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.sync.on .d{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 22%,transparent)}
.sync.warn{color:var(--amb);border-color:color-mix(in srgb,var(--amb) 40%,transparent)}
.sync.warn .d{background:var(--amb)}
.sync.busy .d{background:var(--a1);animation:pulse 1s ease-in-out infinite}
.sync.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);
  background:color-mix(in srgb,var(--red) 10%,transparent)}
.sync.bad .d{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ═══════════════ layout ═══════════════ */
.shell{display:grid;grid-template-columns:262px 1fr;gap:20px;max-width:1460px;margin:0 auto;padding:20px;align-items:start}
.card{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--s2)}
aside{position:sticky;top:82px}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 15px;border-bottom:1px solid var(--ln2)}
.rail-h h2{margin:0;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:750}
.rail{max-height:calc(100vh - 240px);overflow:auto;padding:9px}
.rail::-webkit-scrollbar{width:7px}.rail::-webkit-scrollbar-thumb{background:var(--ln);border-radius:8px}
.oi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;
  border:1px solid transparent;margin-bottom:2px;transition:.16s;position:relative}
.oi:hover{background:var(--surf2)}
.oi.on{background:color-mix(in srgb,var(--a1) 10%,transparent);border-color:color-mix(in srgb,var(--a1) 26%,transparent)}
.oi.on::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:20px;
  border-radius:0 3px 3px 0;background:linear-gradient(var(--a1),var(--a2))}
.oi .nm{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.oi .sb{font-size:11.5px;color:var(--tx2);display:block}

/* logo blocks */
.lg{width:36px;height:36px;border-radius:11px;flex:none;position:relative;overflow:hidden;box-shadow:var(--s1);
  display:grid;place-items:center;background:var(--surf3)}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.lg .fb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:750;font-size:13px;letter-spacing:-.4px}
.lg.xl{width:64px;height:64px;border-radius:18px}
.lg.xl .fb{font-size:23px}
.lg.sm{width:30px;height:30px;border-radius:9px}
.lg.sm .fb{font-size:11px}

/* ═══════════════ detail ═══════════════ */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{padding:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),transparent);z-index:1}
.hero::after{content:"";position:absolute;right:-90px;top:-130px;width:340px;height:340px;border-radius:50%;
  pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--a2) 17%,transparent),transparent 68%)}
.hero > *{position:relative}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.hero h1{margin:0 0 5px;font-size:26px;letter-spacing:-.9px;font-weight:780;line-height:1.15}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--ln);color:var(--tx2)}
.notes{margin:11px 0 0;color:var(--tx2);font-size:13.5px;white-space:pre-wrap;max-width:72ch}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--ln2)}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.m{position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);
  padding:14px 16px;box-shadow:var(--s1);transition:transform .22s cubic-bezier(.2,.9,.3,1.2),box-shadow .22s,border-color .2s}
.m::after{content:"";position:absolute;right:-16px;top:-16px;width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--a1) 22%,transparent),transparent 70%);pointer-events:none}
.m:hover{transform:translateY(-2px);box-shadow:var(--s2);border-color:color-mix(in srgb,var(--a1) 30%,var(--ln))}
.m .ic{position:relative;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;margin-bottom:9px;
  background:color-mix(in srgb,var(--a1) 13%,transparent);color:var(--a1)}
.m .ic svg{width:14px;height:14px}
.m b{display:block;font-size:24px;font-weight:750;letter-spacing:-1px;line-height:1.1}
.m span{font-size:11.5px;color:var(--tx2);font-weight:650;letter-spacing:.02em}
.m .hl{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:650}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:0 2px}
.sec-h h3{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.3px;font-weight:720}
.sec-h h3 svg{width:16px;height:16px;color:var(--a1)}
.ct{font-size:11.5px;font-weight:750;color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);padding:1px 8px;border-radius:999px}

/* ═══════════════ toolbar — group by · area · region · language ═══════════════ */
.tbar{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);box-shadow:var(--s1);
  padding:10px 12px;margin:0 0 13px;display:flex;flex-direction:column;gap:8px}
.tb-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tb-l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:750;flex:none}
.tb-n{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);font-weight:650}
/* why the grouping on screen is not the one the switch says */
.tb-fb{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--tx3);line-height:1.5;padding-top:5px}
.tb-fb svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--amb)}
.tb-fb b{color:var(--tx2)}
.seg.gb button{display:inline-flex;align-items:center;gap:5px}
.seg.gb button svg{width:13px;height:13px;opacity:.75}
.seg.gb button.on svg{color:var(--a1);opacity:1}
/* one filter tier: fixed label gutter, chips wrapping in the rest */
.frow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 9px;align-items:start;
  padding-top:8px;border-top:1px dashed var(--ln2)}
.frow .fl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:750;padding-top:7px;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.lc{font-size:12.5px;font-weight:650;padding:6px 11px;border-radius:999px;color:var(--tx2);
  background:var(--surf2);border:1px solid var(--ln);transition:.16s;display:inline-flex;align-items:center;gap:6px;
  max-width:100%;min-width:0}
/* the label ellipsises, never the flag or the count beside it */
.lc>.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lc:hover{color:var(--tx);border-color:color-mix(in srgb,var(--a1) 42%,var(--ln))}
.lc.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;
  box-shadow:0 5px 16px -8px color-mix(in srgb,var(--a1) 90%,transparent)}
.lc.on .flg{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.lc .n{font-size:11px;font-weight:750;opacity:.72;font-variant-numeric:tabular-nums;flex:none}

/* ═══════════════ flags ═══════════════
   A real image with the ISO code sitting underneath as the fallback — Windows ships no
   country-flag glyphs at all, so an emoji flag would render as two bare letters there. */
.flg{position:relative;display:inline-grid;place-items:center;overflow:hidden;flex:none;
  width:21px;height:15px;border-radius:3px;background:var(--surf3);box-shadow:inset 0 0 0 1px var(--ln)}
.flg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.flg .fb2{position:relative;font:800 8.5px/1 "Inter",system-ui,sans-serif;letter-spacing:-.3px;color:var(--tx2)}
.flg.xl2{width:38px;height:27px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ln),var(--s1)}
.flg.xl2 .fb2{font-size:13px}
.flg.none{background:none;box-shadow:inset 0 0 0 1.5px var(--ln2)}
.flg.none .fb2{color:var(--tx3);font-size:9px}

/* the flag strip under the org title — every market at a glance */
.rstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.rpill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;
  font-size:11.5px;font-weight:650;color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);
  max-width:100%;min-width:0;transition:.16s}
.rpill:hover{color:var(--tx);border-color:color-mix(in srgb,var(--a1) 40%,var(--ln))}
.rpill.on{color:var(--tx);background:color-mix(in srgb,var(--a1) 14%,transparent);
  border-color:color-mix(in srgb,var(--a1) 48%,transparent)}
.rpill.on .n{color:var(--a1)}
.rpill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rpill .n{flex:none;font-size:10.5px;font-weight:750;color:var(--tx3);font-variant-numeric:tabular-nums}

.gstack{display:flex;flex-direction:column;gap:13px}
.pg{--c:var(--a1);position:relative;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);
  box-shadow:var(--s1);overflow:hidden;transition:box-shadow .24s,border-color .22s,transform .24s cubic-bezier(.2,.9,.3,1.2)}
.pg::before{content:"";position:absolute;inset:0 0 auto;height:3px;z-index:1;
  background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 35%,transparent))}
.pg:hover{box-shadow:var(--s3);border-color:color-mix(in srgb,var(--c) 34%,var(--ln));transform:translateY(-2px)}
.pg-h{display:flex;align-items:center;gap:12px;padding:13px 15px 12px;border-bottom:1px solid var(--ln2);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--surf)),var(--surf))}
.pg-h .pgt{min-width:0;flex:1;display:block}
.pg-h .nm{display:block;font-weight:720;font-size:15px;letter-spacing:-.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-h .sub{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;margin-top:1px}
.pg-h .ct{flex:none;background:color-mix(in srgb,var(--c) 13%,var(--surf));
  border-color:color-mix(in srgb,var(--c) 30%,var(--ln));color:var(--tx)}
/* a region group leads with its flag instead of a brand chip, so it gets the same 38px slot */
.pg-h .flg.xl2{width:38px;height:27px}

/* ═══ the second tier of the hierarchy — a sub-band inside a group ═══
   Region › Language, Platform › Region, Language › Region: whichever pair is in play, the
   band names it and the rows beneath carry only what is left over. */
.lsub{display:flex;align-items:center;gap:8px;padding:8px 15px 6px;border-top:1px solid var(--ln2);
  background:color-mix(in srgb,var(--c) 4%,var(--surf2))}
.lsub:first-of-type{border-top:0}
.lsub .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--lc,var(--tx3))}
.lsub .dot.none{background:none;border:1.5px dashed var(--tx3);width:8px;height:8px}
.lsub .t{min-width:0;font-size:11.5px;font-weight:750;letter-spacing:.02em;color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsub .t.none{color:var(--tx3);font-weight:650}
.lsub .n{margin-left:auto;flex:none;font-size:11px;font-weight:750;color:var(--tx3);font-variant-numeric:tabular-nums}
/* the band already draws the divider — a second one right under it reads as an empty row */
.lsub + .gr{border-top:0}

/* one row = one channel: [ the leftover dimension ] · link · actions */
.gr{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr) auto;align-items:center;
  gap:6px 12px;padding:9px 15px;border-top:1px solid var(--ln2);transition:background .16s}
.gr:first-of-type{border-top:0}
.gr:hover{background:color-mix(in srgb,var(--c) 5%,transparent)}

<script>
(() => {
"use strict";

/* ═══════════════════ optional libs (never fatal) ═══════════════════ */
const G = () => window.gsap;
const reduce = () => matchMedia("(prefers-reduced-motion:reduce)").matches;

function icons(root){
  const l = window.lucide;
  if(l && l.createIcons){ try{ l.createIcons({ root: root || document.body, attrs:{ "stroke-width":2 } }); return; }catch(e){} }
  (root || document).querySelectorAll("[data-lucide]").forEach(el => {
    if(el.dataset.fbd) return;
    el.dataset.fbd = "1";
    const host = el.closest("[data-fb]");
    if(host){ host.textContent = host.dataset.fb; } else { el.remove(); }
  });
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    try{ if(document.fonts.check('1em "simple-icons"')) document.body.classList.add("si-ok"); }catch(e){}
  });

/* Entrance animation.
   Uses fromTo() with an explicit end state — never from(). A bare from() records
   its end value at creation time, so calling it twice on the same element makes the
   second tween animate 0 -> 0 and the content stays invisible for good.
   clearProps also strips the inline styles afterwards, so nothing can be left stranded. */
function anim(t, from){
  const g = G();
  if(!t || !g || reduce()) return;
  try{
    const els = typeof t === "string" ? document.querySelectorAll(t) : t;
    if(!els || (els.length === 0 && !els.nodeType)) return;
    g.killTweensOf(els);
    g.set(els, { clearProps:"opacity,transform" });
    const start = Object.assign({}, from);
    const end = { opacity:1, x:0, y:0, scale:1, duration:.4, ease:"power3.out",
                  overwrite:"auto", clearProps:"opacity,transform" };
    ["duration","ease","stagger","delay"].forEach(k => {
      if(start[k] !== undefined){ end[k] = start[k]; delete start[k]; }
    });
    g.fromTo(els, start, end);
    // Safety net: visibility must never depend on the animation finishing.
    // A backgrounded tab pauses requestAnimationFrame, which would otherwise leave
    // content stuck at opacity 0. Stripping the inline styles reveals it regardless.
    setTimeout(() => { try{ g.set(els, { clearProps:"opacity,transform" }); }catch(e){} }, 1600);
  }catch(e){}
}

/* ═══════════════════ constants ═══════════════════ */
const DEF_PLATFORMS = [
  { id:"facebook",  name:"Facebook",        color:"#1877f2", icon:"si:facebook" },
  { id:"instagram", name:"Instagram",       color:"#e1306c", icon:"si:instagram" },
  { id:"x",         name:"X (Twitter)",     color:"#16181c", icon:"si:x" },

  { id:"youtube",   name:"YouTube",         color:"#ff0033", icon:"si:youtube" },
  { id:"tiktok",    name:"TikTok",          color:"#00b8c4", icon:"si:tiktok" },
  { id:"threads",   name:"Threads",         color:"#3d3d3d", icon:"si:threads" },
  { id:"pinterest", name:"Pinterest",       color:"#bd081c", icon:"si:pinterest" },
  { id:"whatsapp",  name:"WhatsApp",        color:"#25d366", icon:"si:whatsapp" },
  { id:"telegram",  name:"Telegram",        color:"#229ed9", icon:"si:telegram" },
  { id:"snapchat",  name:"Snapchat",        color:"#c9a800", icon:"si:snapchat" },
  { id:"reddit",    name:"Reddit",          color:"#ff4500", icon:"si:reddit" },
  { id:"discord",   name:"Discord",         color:"#5865f2", icon:"si:discord" },
  { id:"spotify",   name:"Spotify",         color:"#1db954", icon:"si:spotify" },
  { id:"gbp",       name:"Google Business", color:"#34a853", icon:"lucide:store" },
  { id:"other",     name:"Other channel",  color:"#64748b", icon:"lucide:at-sign" },
];
const THEMES = [
  { a1:"#5b6bff", a2:"#a855f7" }, { a1:"#0ea5e9", a2:"#22d3ee" }, { a1:"#10b981", a2:"#84cc16" },
  { a1:"#f43f5e", a2:"#f97316" }, { a1:"#f59e0b", a2:"#eab308" }, { a1:"#8b5cf6", a2:"#ec4899" },
  { a1:"#334155", a2:"#64748b" },
];
/* Last-resort language list: only ever reached when the catalog below cannot be loaded AND
   the browser has no Intl.DisplayNames. The field stays free text either way. */
const LANGS = [
  "English", "Hindi", "Tamil", "Telugu", "Kannada", "Malayalam", "Bengali", "Marathi",
  "Gujarati", "Punjabi", "Odia", "Assamese", "Urdu",
  "Arabic", "Spanish", "French", "Portuguese", "Indonesian",
  "Vietnamese", "Thai", "Chinese", "Japanese", "Korean", "Filipino", "Malay", "Khmer", "Burmese",
];
const NO_LANG = "Not set";                              // label for a channel with no language yet
const NO_REG  = "No region";                            // ditto for region

/* ═══════════════════ country & language catalog ═══════════════════
   Countries, the languages each one speaks, and the continent it sits on all come from a
   published dataset rather than a list maintained by hand — so "Vietnam ⇒ Vietnamese" and
   "Thailand ⇒ Thai" are facts the app looks up, not entries somebody has to remember to add.

   Same jsDelivr origin the icon and animation libraries already come from, fetched once and
   kept in localStorage for a month. Three fallbacks sit behind it, because a directory that
   cannot be edited when a CDN is down is a broken directory:
     1  the cached copy, however old
     2  Intl.DisplayNames — every modern browser can already name all ~250 regions and every
        language offline; only the country⇒language mapping is missing, so LANG_ALIASES below
        stands in for the common markets
     3  the bare LANGS list above                                                            */
const GEO_CDN = "https://cdn.jsdelivr.net/npm/countries-list@3.1.1/";
const GKEY = "orghub.geo.v2", GTTL = 30 * 864e5;

const GEO = {
  source:"", countries:[], languages:[], continents:{},
  byCode:new Map(),      // "VN" -> { code, name, native, continent, langs:[names] }
  langByKey:new Map(),   // "vietnamese"/"vi" -> canonical "Vietnamese"
  regByKey:new Map(),    // "vietnam"/"việt nam" -> "VN"
};

/* "Panjabi / Punjabi" and "Tagalog / Filipino" are one language wearing two names. The first
   is the label; both halves still resolve when matching what somebody typed. */
const headName = n => String(n || "").split("/")[0].trim();
const key = s => String(s || "").trim().toLowerCase();

function indexGeo(raw){
  const conts = raw.continents || {};
  const langs = raw.languages || {};
  const countries = [];

  GEO.langByKey.clear(); GEO.regByKey.clear(); GEO.byCode.clear();

  const langName = {};
  Object.keys(langs).forEach(code => {
    const full = langs[code] && langs[code].name;
    if(!full) return;
    const nm = headName(full);
    langName[code] = nm;
    GEO.langByKey.set(key(code), nm);
    full.split("/").forEach(part => { const k = key(part); if(k) GEO.langByKey.set(k, nm); });
    const nat = langs[code] && langs[code].native;
    if(nat) nat.split("/").forEach(part => { const k = key(part); if(k) GEO.langByKey.set(k, nm); });
  });

  Object.keys(raw.countries || {}).forEach(code => {
    const c = raw.countries[code] || {};
    if(!c.name) return;
    const e = {
      code, name:c.name, native:c.native || c.name, continent:c.continent || "",
      langs:(c.languages || []).map(l => langName[l] || "").filter(Boolean),
    };
    countries.push(e);
    GEO.byCode.set(code, e);
    GEO.regByKey.set(key(c.name), code);
    if(c.native) GEO.regByKey.set(key(c.native), code);
  });

  GEO.continents = conts;
  GEO.countries = countries.sort((a, b) => a.name.localeCompare(b.name));
  /* Only languages somebody could actually pick — the dataset's own names, deduped by label */
  const seen = new Set();
  GEO.languages = Object.keys(langs)
    .map(code => ({ code, name:headName(langs[code].name), native:langs[code].native || "" }))
    .filter(l => l.name && !seen.has(l.name) && seen.add(l.name))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* Codes Intl will happily name that are not places a social channel can belong to: political
   groupings, the pseudo-locales used for testing, and the "unknown region" placeholder. */
const NON_COUNTRY = ["EU", "EZ", "UN", "QO", "QU", "XA", "XB", "ZZ"];

/* No catalog: name every region and language out of the browser itself. Intl has no list of
   valid region codes, but it does return undefined for codes that are not real — so walking
   AA..ZZ once and keeping what it names produces the full ISO 3166-1 set with no data file. */
function geoFromIntl(){
  const raw = { countries:{}, languages:{}, continents:{} };
  let R = null, L = null;
  try{ R = new Intl.DisplayNames(["en"], { type:"region", fallback:"none" }); }catch(e){}
  try{ L = new Intl.DisplayNames(["en"], { type:"language", fallback:"none" }); }catch(e){}
  if(R){
    for(let a = 65; a <= 90; a++) for(let b = 65; b <= 90; b++){
      const code = String.fromCharCode(a, b);
      if(NON_COUNTRY.indexOf(code) !== -1) continue;
      let nm = ""; try{ nm = R.of(code) || ""; }catch(e){}
      if(nm && nm !== code) raw.countries[code] = { name:nm, languages:[] };
    }
  }
  /* The alias table is keyed by what people type and its values are language names — enough to
     seed a picker, and it carries the country⇒language pairs Intl has no answer for.
     Keyed by the full name rather than an abbreviation of it: "Malay" and "Malayalam" share
     their first three letters, and one would quietly overwrite the other. */
  const names = new Set([...LANGS, ...(L ? Object.keys(LANG_ALIASES).map(k => LANG_ALIASES[k]) : [])]);
  names.forEach(nm => { raw.languages[nm.toLowerCase()] = { name:nm, native:"" }; });
  indexGeo(raw);
  /* recover the country⇒language link the alias table already encodes ("vietnam" ⇒ Vietnamese) */
  Object.keys(LANG_ALIASES).forEach(k => {
    const code = GEO.regByKey.get(k);
    const e = code && GEO.byCode.get(code);
    if(e && e.langs.indexOf(LANG_ALIASES[k]) === -1) e.langs.push(LANG_ALIASES[k]);
  });
  GEO.source = "browser";
}

async function loadGeo(){
  try{
    const c = JSON.parse(localStorage.getItem(GKEY) || "null");
    if(c && c.at && Date.now() - c.at < GTTL && c.raw && c.raw.countries){
      indexGeo(c.raw); GEO.source = "cache"; return;
    }
  }catch(e){}
  /* A blocked CDN can hang a fetch until the browser's own timeout, which would be minutes of
     an app that will not open. Give up after 8 seconds and take the Intl route instead. */
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const bail = setTimeout(() => { try{ ctl && ctl.abort(); }catch(e){} }, 8000);
  try{
    const [countries, languages, continents] = await Promise.all(
      ["countries.min.json", "languages.all.min.json", "continents.min.json"]
        .map(f => fetch(GEO_CDN + f, { cache:"force-cache", signal:ctl ? ctl.signal : undefined }).then(r => {
          if(!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })));
    const raw = { countries, languages, continents };
    indexGeo(raw);
    GEO.source = "cdn";
    try{ localStorage.setItem(GKEY, JSON.stringify({ at:Date.now(), raw })); }catch(e){}
  }catch(e){
    /* a stale cache still beats no catalog at all */
    try{
      const c = JSON.parse(localStorage.getItem(GKEY) || "null");
      if(c && c.raw && c.raw.countries){ indexGeo(c.raw); GEO.source = "cache"; return; }
    }catch(e2){}
    geoFromIntl();
  }finally{ clearTimeout(bail); }
}

/* ── lookups every renderer uses ── */
const country     = code => GEO.byCode.get(String(code || "").toUpperCase()) || null;
const regionName  = code => { const c = country(code); return c ? c.name : String(code || ""); };
const continentOf = code => { const c = country(code); return c ? c.continent : ""; };
const contName    = cc => GEO.continents[cc] || cc || "";
const langsOfCountry = code => { const c = country(code); return c ? c.langs.slice() : []; };

/* Flags are images, not emoji: Windows ships no country-flag glyphs, so 🇻🇳 renders there as
   a bare "VN". The ISO code sits underneath every one of them as the fallback anyway. */
function flagBox(code, cls){
  const cc = String(code || "").trim();
  if(!cc) return `<span class="flg none ${cls || ""}"><span class="fb2">—</span></span>`;
  const lo = cc.toLowerCase();
  return `<span class="flg ${cls || ""}"><span class="fb2">${esc(cc.toUpperCase())}</span>` +
    (/^[a-z]{2}$/.test(lo)
      ? `<img src="https://flagcdn.com/w40/${lo}.png" srcset="https://flagcdn.com/w80/${lo}.png 2x" alt="" loading="lazy">`
      : "") + `</span>`;
}

/* Canonical spelling for a language somebody typed. Two spellings of one language would
   otherwise cluster into two groups, which defeats the point of grouping at all. */
function canonLang(text){
  const t = String(text || "").trim();
  if(!t) return "";
  return GEO.langByKey.get(key(t)) || LANG_ALIASES[key(t)] || t;
}
/* The reverse: a country whose ONLY language is this one. Vietnamese ⇒ Vietnam and Thai ⇒
   Thailand are unambiguous; English and Spanish are spoken almost everywhere, so they stay
   unanswered rather than guessed wrong. */
function soleCountryFor(lang){
  const nm = canonLang(lang);
  if(!nm) return "";
  const hits = GEO.countries.filter(c => c.langs.indexOf(nm) !== -1);
  return hits.length === 1 ? hits[0].code : "";
}

/* Recognising a language written by hand. Keyed by what people actually type — which
   includes the country rather than the language ("china", "vietnam") — and mapped to one
   canonical spelling, because two spellings of the same language would otherwise cluster
   into two separate groups, defeating the point of grouping at all. */
const LANG_ALIASES = {
  english:"English", hindi:"Hindi", tamil:"Tamil", telugu:"Telugu", kannada:"Kannada",
  malayalam:"Malayalam", bengali:"Bengali", bangla:"Bengali", marathi:"Marathi",
  gujarati:"Gujarati", punjabi:"Punjabi", odia:"Odia", oriya:"Odia", assamese:"Assamese",
  urdu:"Urdu", nepali:"Nepali", sinhala:"Sinhala", bhojpuri:"Bhojpuri",
  arabic:"Arabic", spanish:"Spanish", french:"French", portuguese:"Portuguese",
  german:"German", italian:"Italian", russian:"Russian", turkish:"Turkish", dutch:"Dutch",
  indonesian:"Indonesian", bahasa:"Indonesian", malay:"Malay", malaysia:"Malay",
  vietnamese:"Vietnamese", vietnam:"Vietnamese", thai:"Thai", thailand:"Thai",
  chinese:"Chinese", china:"Chinese", mandarin:"Chinese", cantonese:"Cantonese",
  japanese:"Japanese", japan:"Japanese", korean:"Korean", korea:"Korean",
  filipino:"Filipino", tagalog:"Filipino", khmer:"Khmer", cambodia:"Khmer",
  burmese:"Burmese", myanmar:"Burmese", lao:"Lao", laos:"Lao",
  persian:"Persian", farsi:"Persian", swahili:"Swahili", hausa:"Hausa",
};
/* true when a and b differ by at most one insertion, deletion or substitution —
   enough to forgive "chaina" for "china" without matching unrelated words */
function ed1(a, b){
  if(a === b) return true;
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, diff = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++diff > 1) return false;
    if(a.length > b.length) i++;
    else if(a.length < b.length) j++;
    else { i++; j++; }
  }
  return diff + (a.length - i) + (b.length - j) <= 1;
}
/* Fuzzy matching is only safe on longer words. "Lao" is one edit away from Tao, Law, Lab,
   Leo and plenty of other ordinary words, so anything short has to match exactly. */
const FUZZY_MIN = 5;
function matchWord(w){
  if(w.length < 3 || w.length > 14) return "";
  if(LANG_ALIASES[w]) return LANG_ALIASES[w];
  if(w.length < FUZZY_MIN) return "";
  for(const a in LANG_ALIASES) if(a.length >= FUZZY_MIN && ed1(w, a)) return LANG_ALIASES[a];
  return "";
}
/* Notes are rarely a bare language name — "Hindi version", "in Tamil", "Tamil (South)" are
   all far more typical — so test each word rather than the note squashed into one string. */
function guessLang(text){
  const words = String(text || "").toLowerCase().split(/[^a-z]+/).filter(Boolean);
  if(!words.length || words.length > 4) return "";
  for(const w of words){ const hit = matchWord(w); if(hit) return hit; }
  /* the catalog knows every language name the alias table does not */
  for(const w of words){ if(w.length >= 4 && GEO.langByKey.has(w)) return GEO.langByKey.get(w); }
  return "";
}

const GENERIC_TLD = ["CO", "TV", "ME", "IO", "AI", "FM", "TO", "SH", "CC", "GG", "LY", "WS", "ST", "AC", "IS", "AM", "GL"];

/* Country names get the same one-edit forgiveness the language names get — "chaina" and
   "Thailnad" are what a hurried note actually looks like. Held to the same FUZZY_MIN, because
   short country names are one edit from ordinary words: Chad/chat, Mali/mall, Oman/open. */
function matchCountry(w){
  if(w.length < FUZZY_MIN || w.length > 20) return "";
  if(GEO.regByKey.has(w)) return GEO.regByKey.get(w);
  for(const c of GEO.countries){
    const nm = c.name.toLowerCase();
    if(nm.length >= FUZZY_MIN && ed1(w, nm)) return c.code;
  }
  return "";
}

/* ═══ working out which country a channel belongs to, from what is already on it ═══
   Three independent signals, strongest first. Every one of them is a guess, so nothing here
   writes to a channel on its own — Settings shows the whole list for approval first. */
function guessRegion(s){
  /* 1 · a country-coded domain or handle: aikokids.vn, /@AikoTH, .co.th */
  const hay = (String(s.url || "") + " " + String(s.handle || "")).toLowerCase();
  /* whitespace has to end a domain as surely as a slash does — the url and the handle are
     joined by a space, so without it "facebook.com/aikokids.vn " with no handle never matches */
  const tld = hay.match(/\.([a-z]{2})(?:[\/:?#\s]|$)/);
  if(tld){
    /* .uk is the one country domain that is not its own ISO code */
    const cc = tld[1] === "uk" ? "GB" : tld[1].toUpperCase();
    /* These are sold worldwide as generic domains far more often than they are used by
       Colombia, Tuvalu, Montenegro, the BIOT or Anguilla — ".vn" means Vietnam, ".io" does
       not mean the British Indian Ocean Territory. */
    if(country(cc) && GENERIC_TLD.indexOf(cc) === -1) return cc;
  }
  /* 2 · a country named in the note — "Vietnam page", "China (Mandarin)", "Thailnad" */
  const words = String(s.note || "").toLowerCase().split(/[^a-z]+/).filter(Boolean);
  for(const w of words){
    if(w.length < 4) continue;
    if(GEO.regByKey.has(w)) return GEO.regByKey.get(w);
    const near = matchCountry(w);
    if(near) return near;
    /* the alias table maps the country somebody typed onto its language, so run it back the
       other way: "vietnamse" ⇒ Vietnamese ⇒ the one country that speaks it */
    const viaLang = matchWord(w);
    if(viaLang){ const c = soleCountryFor(viaLang); if(c) return c; }
  }
  /* 3 · a language only one country in the world speaks */
  return soleCountryFor(langOf(s));
}
const LKEY = "orghub.v1", HKEY = "orghub.health", HTTL = 3600e3, GMKEY = "orghub.groupby";

const blank = () => ({
  settings:{ title:"Aiko", a1:"#5b6bff", a2:"#a855f7", theme:"dark", passHash:null,
             platforms:DEF_PLATFORMS.map(p => ({ ...p })) },
  orgs:[]
});
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

/* ═══════════════════ state ═══════════════════ */
let state = blank();
let cloud = { mode:"local", configured:false, adminReady:false, updatedAt:null, saving:false, error:null };
let unlocked = false, selected = null, query = "", booting = true;
/* set for a render that must not replay the entrance animation — a repaint the user did not ask
   for, triggered by something arriving late rather than by anything they did */
let quiet = false;
let health = {};                                        // url -> {ok,status,note,at}
let checking = new Set();
/* Three independent narrowings, each null = "everything". "" is a real value in the region
   and language ones — the channels that have none — so null and "" must stay tellable apart. */
let langFilter = null, regFilter = null, contFilter = null;
/* which dimension owns the outer group. Region leads by default: a market is the thing a
   channel belongs to, and its language follows from it far more often than the reverse. */
let groupMode = (() => { try{ return localStorage.getItem(GMKEY) || "region"; }catch(e){ return "region"; } })();
const GROUPS = [
  { id:"region",   label:"Region",   icon:"map-pin" },
  { id:"platform", label:"Platform", icon:"share-2" },
  { id:"language", label:"Language", icon:"languages" },
];

function normalize(d){
  const b = blank();
  const st = { settings:{ ...b.settings, ...((d && d.settings) || {}) },
               orgs:(d && Array.isArray(d.orgs)) ? d.orgs : [] };
  if(d && d.settings && d.settings.accent && !d.settings.a1){ st.settings.a1 = d.settings.accent; st.settings.a2 = d.settings.accent; }
  /* one-time rename: saved settings from earlier versions still carry the old title */
  if(["Org Hub", "Aiko Org Hub"].indexOf(st.settings.title) !== -1) st.settings.title = "Aiko";
  st.settings.platforms = (st.settings.platforms || []).map(p => {
    const def = DEF_PLATFORMS.find(x => x.id === p.id);
    return { ...p, icon:p.icon || (def ? def.icon : "") };
  });
  if(!st.settings.platforms.length) st.settings.platforms = b.settings.platforms;
  st.orgs.forEach(o => {
    o.websites = o.websites || []; o.socials = o.socials || []; o.tags = o.tags || [];
    /* `language` and `region` each arrived after the first channels were saved, so older rows
       simply have no such key. Default both to "" — unset is a legitimate state that renders
       as its own group, never as a hole in the layout. Region is stored as an ISO 3166-1
       alpha-2 code, so the flag, the country name and its languages are all derivable and
       none of them has to be written down twice. */
    o.socials.forEach(s => {
      s.language = String(s.language || "").trim();
      s.region   = String(s.region || "").trim().toUpperCase();
    });
  });
  return st;
}
const readLocal  = () => { try{ return normalize(JSON.parse(localStorage.getItem(LKEY) || "null")); }catch(e){ return blank(); } };
const writeLocal = () => { try{ localStorage.setItem(LKEY, JSON.stringify(state)); }catch(e){} };
const adminKey   = () => sessionStorage.getItem("orghub.key") || "";

try{ const h = JSON.parse(localStorage.getItem(HKEY) || "{}"); if(h && typeof h === "object") health = h; }catch(e){}

/* ═══════════════════ cloud layer ═══════════════════ */
/* The last directory the cloud actually handed us, kept per browser.
   It exists for one reason: when the database cannot be reached, an empty page is a lie.
   The data is still there, so anyone who has opened the site before should keep seeing it —
   read-only, clearly labelled, and never mistaken for something they are allowed to edit.
   Deliberately a different key from LKEY: local-mode data can be uploaded to the cloud, and
   this must never end up anywhere near that path. */
const CKEY = "orghub.lastgood.v1";
function saveLastGood(updatedAt){
  try{
    localStorage.setItem(CKEY, JSON.stringify({ at:Date.now(), updatedAt, data:cloudPayload() }));
  }catch(e){}                                         // a full quota must never break a save
}
function readLastGood(){
  try{
    const c = JSON.parse(localStorage.getItem(CKEY) || "null");
    return (c && c.data && Array.isArray(c.data.orgs)) ? c : null;
  }catch(e){ return null; }
}

/* Distinguishes the two failures that used to look identical:
     backend:true   the server answered, its database did not  -> an outage
     backend:false  we never reached the server at all         -> could be either  */
async function pull(){
  let j;
  try{
    const r = await fetch("api/data", { cache:"no-store" });
    j = await r.json();
  }catch(e){
    throw Object.assign(new Error(String(e.message || e)), { backend:false });
  }
  if(!j.ok) throw Object.assign(new Error(j.error || "read failed"), { backend:true });
  cloud.configured = !!j.configured;
  cloud.adminReady = !!j.adminReady;
  if(j.configured){
    cloud.mode = "cloud"; cloud.updatedAt = j.updatedAt || null; cloud.error = null;
    state = normalize(j.data);
    saveLastGood(cloud.updatedAt);
  }else{
    cloud.mode = "local"; state = readLocal();
  }
}

/* A cold Supabase answers 521 for a few seconds before it is properly up, and a phone changing
   networks drops one request. Neither is an outage, so do not present them as one — three
   quick tries before the page commits to saying anything is wrong. */
async function pullWithRetry(tries){
  let last;
  for(let i = 0; i < (tries || 3); i++){
    try{ await pull(); return null; }
    catch(e){
      last = e;
      if(i < (tries || 3) - 1) await new Promise(r => setTimeout(r, 700 * Math.pow(2, i)));
    }
  }
  return last;
}

/* Everything the page needs to know about an unreachable database, decided in one place. */
function goOffline(err){
  const cached = readLastGood();
  cloud.mode = "offline";
  cloud.error = String((err && err.message) || err || "unreachable");
  if(cached){
    state = normalize(cached.data);
    cloud.updatedAt = cached.updatedAt || null;
    cloud.cachedAt = cached.at || null;
  }else{
    state = blank();
    cloud.updatedAt = cloud.cachedAt = null;
  }
}

/* Used by the Retry button and by the automatic re-check. Returns true once the cloud is back. */
async function tryReconnect(){
  const err = await pullWithRetry(2);
  if(err){ goOffline(err); render(); return false; }
  if(cloud.mode === "cloud"){ setUnlocked(false); toast("Database is back · showing live data", "cloud"); }
  render();
  return true;
}

/* GET /api/data is public, so the row must never carry the local password hash —
   an exposed hash of a reused password is brute-forceable offline. In cloud mode the
   password lives only in the ADMIN_PASSWORD env var, so the hash is dead weight anyway. */
function cloudPayload(){
  const copy = { ...state, settings:{ ...state.settings } };
  delete copy.settings.passHash;
  return copy;
}

async function persist(){
  /* Offline means the cloud holds the real directory and we cannot see it. Writing to browser
     storage here would build up a shadow copy that Settings would later offer to "upload to
     cloud" — replacing 54 live channels with whatever was typed during the outage. */
  if(cloud.mode === "offline"){
    toast("Database is offline — nothing can be changed until it is back", "cloud-off");
    return false;
  }
  if(cloud.mode !== "cloud"){ writeLocal(); return true; }
  cloud.saving = true; cloud.error = null; paintSync();
  try{
    const r = await fetch("api/data", {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-key":adminKey() },
      body:JSON.stringify({ data:cloudPayload(), baseUpdatedAt:cloud.updatedAt })
    });
    const j = await r.json().catch(() => ({}));
    if(r.status === 409){
      cloud.saving = false; paintSync();
      const go = await confirmBox("Changed on another device",
        "Someone saved a newer version of this data. Reload to get the latest — your unsaved change here will be lost.", false);
      if(go){ await pull(); render(); }
      return false;
    }
    if(r.status === 401){
      cloud.saving = false; setUnlocked(false);
      toast("Session expired — sign in again", "lock"); return false;
    }
    if(!r.ok || !j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
    cloud.updatedAt = j.updatedAt || cloud.updatedAt;
    cloud.saving = false; paintSync();
    return true;
  }catch(e){
    cloud.saving = false; cloud.error = String(e.message || e); paintSync();
    toast("Could not save: " + cloud.error, "triangle-alert");
    return false;
  }
}
/* every mutation goes through this */
async function commit(msg, ic){
  const ok = await persist();
  render();
  if(ok && msg) toast(msg, ic || "check");
  return ok;
}

/* ═══════════════════ helpers ═══════════════════ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const org = id => state.orgs.find(o => o.id === id);

function safeUrl(u){
  const s = String(u || "").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";
  return "https://" + s.replace(/^\/+/, "");
}
function hostOf(u){ try{ return new URL(safeUrl(u)).hostname; }catch(e){ return ""; } }
function pretty(u){
  try{ const x = new URL(safeUrl(u)); return (x.host.replace(/^www\./, "") + x.pathname).replace(/\/$/, ""); }
  catch(e){ return String(u || ""); }
}
/* logo auto-fetch — favicon straight from the domain, no API key */
function favicon(u, sz){
  const h = hostOf(u);
  return h ? "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(h) + "&sz=" + (sz || 64) : "";
}
const platform = id => state.settings.platforms.find(p => p.id === id) ||
  { id:"other", name:"Other channel", color:"#64748b", icon:"lucide:at-sign" };

/* ═══════════════════ clustering ═══════════════════
   Region, language and platform are three independent facts about a channel. Any one of them
   can own the outer group; the other two then appear as a sub-band and a row pill. Region and
   language are deliberately never fused into one value — Singapore runs four languages and
   Spanish runs across twenty countries, so collapsing the pair loses real information. */
const langOf = s => String((s && s.language) || "").trim();
const regOf  = s => String((s && s.region) || "").trim().toUpperCase();

/* unset values sink to the bottom of every list; everything named sorts alphabetically */
const byLabel = (a, b) => (!a !== !b) ? (a ? -1 : 1) : String(a).localeCompare(String(b));

/* Group on the RESOLVED platform id, not the raw one. A channel whose platform was
   later deleted falls back to the shared "other" entry — grouping on the raw id would
   give every deleted platform its own group, all of them titled "Other channel". */
const platRank = id => {
  const i = state.settings.platforms.map(p => p.id).indexOf(id);
  return i < 0 ? 9e3 : i;
};

/* The three dimensions, described once. Everything below — grouping, sub-banding, filtering,
   counting, the plain-text export — reads them from here rather than re-deriving them. */
const DIM = {
  region: {
    key:   s => regOf(s),
    label: v => v ? regionName(v) : NO_REG,
    /* by continent first, so neighbouring markets land next to each other */
    sort:  (a, b) => byLabel(a && contName(continentOf(a)), b && contName(continentOf(b)))
                     || byLabel(a && regionName(a), b && regionName(b)),
  },
  language: {
    key:   s => langOf(s),
    label: v => v || NO_LANG,
    sort:  byLabel,
  },
  platform: {
    key:   s => platform(s.platform).id,
    label: v => platform(v).name,
    sort:  (a, b) => platRank(a) - platRank(b),
  },
};
/* Which dimension becomes the sub-band under each outer group. Region stays as high in the
   hierarchy as it can get: it leads on its own, and is the sub-band under both of the others. */
const SUBDIM = { region:"language", language:"region", platform:"region" };

function bucket(list, dim){
  const m = new Map();
  list.forEach(s => {
    const k = DIM[dim].key(s);
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(s);
  });
  return [...m.entries()].sort((a, b) => DIM[dim].sort(a[0], b[0]));
}

/* one outer group -> { dim, value, items, sections:[{ value, items }] } */
function clusters(list, mode){
  const sub = SUBDIM[mode];
  return bucket(list, mode).map(([value, items]) => ({
    dim:mode, value, items,
    sections:bucket(items, sub).map(([sv, si]) => ({
      value:sv,
      /* inside a section the rows read in the platform order set in Settings, so Facebook
         always precedes YouTube here exactly as it does in the platform-led view */
      items:si.slice().sort((x, y) =>
        platRank(platform(x.platform).id) - platRank(platform(y.platform).id) ||
        String(x.handle || "").localeCompare(String(y.handle || ""))),
    })),
  }));
}

/* every distinct value of one dimension in a list, with how many channels carry it */
function facet(list, dim){
  return bucket(list, dim).map(([v, items]) => ({ v, n:items.length }));
}
/* the continent tier is a roll-up of the region codes, not a field anybody fills in */
function continentsOf(list){
  const m = new Map();
  list.forEach(s => {
    const r = regOf(s);
    if(!r) return;                                      // no region ⇒ no continent to roll up to
    const c = continentOf(r);
    if(c) m.set(c, (m.get(c) || 0) + 1);
  });
  return [...m.entries()].sort((a, b) => byLabel(contName(a[0]), contName(b[0])))
    .map(e => ({ v:e[0], n:e[1] }));
}
const languagesOf = o => facet(o.socials, "language").map(x => ({ lang:x.v, n:x.n }));
const regionsOf   = o => facet(o.socials, "region");

/* The grouping actually used for one organization. Region leads by default, but an
   organization with nothing but empty regions would render as a single nameless card holding
   every channel it has — strictly less than the platform view it replaced. Until somebody
   fills a region in, fall back and say so rather than showing that card. */
const effMode = o => (groupMode === "region" && !o.socials.some(s => regOf(s))) ? "platform" : groupMode;

/* "Copy all" mirrors exactly what the page shows, in whatever grouping is on screen */
function orgAsText(o){
  const out = [o.name];
  if(o.websites.length){
    out.push("", "WEBSITES");
    o.websites.forEach(w => out.push("  " + (w.label || pretty(w.url)) + " — " + safeUrl(w.url)));
  }
  if(o.socials.length){
    const gm = effMode(o);
    out.push("", "SOCIAL CHANNELS  (by " + gm + ")");
    clusters(o.socials, gm).forEach(g => {
      out.push("", DIM[gm].label(g.value).toUpperCase());
      g.sections.forEach(sec => {
        const many = g.sections.length > 1;
        if(many) out.push("  " + DIM[SUBDIM[gm]].label(sec.value));
        sec.items.forEach(x => out.push((many ? "    " : "  ") +
          platform(x.platform).name + (x.handle ? " · " + x.handle : "") + " — " + safeUrl(x.url)));
      });
    });
  }
  return out.join("\n");
}

function initials(n){
  const p = String(n || "?").trim().split(/\s+/).filter(Boolean);
  return (((p[0] || "?")[0]) + ((p[1] || "")[0] || "")).toUpperCase();
}
function hue(n){ let h = 0; const s = String(n || ""); for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
const grad = n => `linear-gradient(135deg,hsl(${hue(n)} 64% 54%),hsl(${(hue(n) + 44) % 360} 68% 44%))`;

/* Icon specs, in the order they are tried:
     img:URL     a real logo image — used for custom platforms, where the URL is the
                 favicon of the channel's own domain, so any service gets a real mark
     si:slug     the simple-icons webfont (every mainstream network ships one)
     lucide:name a line icon
   Every branch keeps initials underneath, so a blocked or 404 image still reads. */
function iconOf(spec, fallback){
  const s = String(spec || "");
  if(s.startsWith("img:")){
    const u = safeUrl(s.slice(4));
    return `<span class="pic"><span class="ini2">${esc(fallback)}</span>` +
           (u ? `<img src="${esc(u)}" alt="" loading="lazy">` : "") + `</span>`;
  }
  if(s.startsWith("si:"))     return `<span class="ini">${esc(fallback)}</span><i class="si si-${esc(s.slice(3))}"></i>`;
  if(s.startsWith("lucide:")) return `<i data-lucide="${esc(s.slice(7))}"></i>`;
  return `<span class="ini" style="display:block">${esc(fallback)}</span>`;
}
/* A brand new platform has no icon of its own, so borrow the favicon of the domain the
   channel points at — that is "fetch the logo off the internet" with no API key and no
   third-party script.
   With no URL to work from, only fall back to a simple-icons slug when the name matches a
   platform we already ship a real glyph for. Guessing a slug from an arbitrary name gives a
   class like "si-jalo" that does not exist in the font, and CSS hides the initials for ANY
   si: chip once the webfont loads — so the chip would render completely blank. */
function autoIcon(name, url){
  const slug = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  const fav = favicon(url, 128);
  if(fav) return "img:" + fav;
  const known = DEF_PLATFORMS.find(p => p.icon === "si:" + slug);
  return known ? known.icon : "";
}
/* org logo: manual override → favicon of its first website → gradient initials */
function logoBox(o, cls){
  const src = o.logo ? safeUrl(o.logo) : (o.websites[0] ? favicon(o.websites[0].url, 128) : "");
  const fb = `<span class="fb" style="background:${grad(o.name)}">${esc(initials(o.name))}</span>`;
  return `<span class="lg ${cls || ""}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ""}${fb}</span>`;
}
async function sha(t){
  try{
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("orghub$" + t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }catch(e){
    let h = 0x811c9dc5, s = "orghub$" + t;
    for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return "fb" + h.toString(16);
  }
}
let tT;
function toast(msg, ic){
  const t = document.getElementById("toast");
  t.innerHTML = `<i data-lucide="${esc(ic || "check")}"></i><span>${esc(msg)}</span>`;
  icons(t); t.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2600);
}
function copy(txt, msg){
  const done = () => toast(msg || "Copied", "copy");
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(done, fb);
  fb();
  function fb(){
    const a = document.createElement("textarea");
    a.value = txt; a.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copy failed", "triangle-alert"); }
    a.remove();
  }
}
const wireLogos = root => root.querySelectorAll(".lg img,.pic img,.flg img").forEach(img => {
  img.addEventListener("error", () => { img.style.display = "none"; }, { once:true });
  img.addEventListener("load", () => {
    // favicon services return a 16px placeholder for unknown domains — keep the initials then
    if(img.naturalWidth && img.naturalWidth <= 16) img.style.display = "none";
    else { const fb = img.parentNode.querySelector(".fb,.ini2,.fb2"); if(fb) fb.style.display = "none"; }
  }, { once:true });
});

/* ═══════════════════ modal ═══════════════════ */
const veil = document.getElementById("veil"), mo = document.getElementById("mo");
let onEsc = null, onVeil = null;

function openModal(html, opt){
  opt = opt || {};
  mo.className = "mo" + (opt.wide ? " w" : "");
  mo.innerHTML = html;
  veil.classList.add("on");
  icons(mo); wireLogos(mo);
  anim(mo, { y:14, scale:.975, opacity:0, duration:.32, ease:"back.out(1.5)" });
  mo.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  const form = mo.querySelector("form");
  if(form && opt.onSubmit) form.onsubmit = e => { e.preventDefault(); opt.onSubmit(form); };
  const sel = opt.focus === null ? null : (opt.focus || "input,select,textarea");
  const f = sel && mo.querySelector(sel);
  if(f) setTimeout(() => f.focus(), 60);
  onEsc = onVeil = closeModal;
}
function closeModal(){ veil.classList.remove("on"); mo.innerHTML = ""; onEsc = onVeil = null; }
veil.onclick = e => { if(e.target === veil && onVeil) onVeil(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && onEsc) return onEsc();
  if(e.key === "/" && !veil.classList.contains("on") && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); const q = document.getElementById("q"); if(q) q.focus();
  }
});
const X = `<button class="b g i" data-close data-fb="X"><i data-lucide="x"></i></button>`;
function showErr(m){
  let el = mo.querySelector(".err");
  if(!el){ el = document.createElement("div"); el.className = "err"; mo.querySelector(".mb").appendChild(el); }
  el.textContent = m; el.classList.add("on"); anim(el, { y:-4, opacity:0, duration:.22 });
}
function confirmBox(title, body, danger){
  danger = danger !== false;
  return new Promise(res => {
    openModal(`
      <div class="mh"><h3><i data-lucide="${danger ? "triangle-alert" : "circle-help"}"></i>${esc(title)}</h3>${X}</div>
      <div class="mb"><div style="color:var(--tx2);line-height:1.6">${body}</div></div>
      <div class="mf"><button class="b" data-close>Cancel</button>
        <button class="b ${danger ? "d" : "p"}" id="y">${danger ? "Yes, delete" : "Continue"}</button></div>`,
      { focus:"#y" });
    mo.querySelector("#y").onclick = () => { closeModal(); res(true); };
    onEsc = onVeil = () => { closeModal(); res(false); };
  });
}

/* ═══════════════════ searchable picker ═══════════════════
   One component behind both the country field and the language field. Neither list is short
   enough for a plain <select> — 250 countries, 185 languages — and the language one still has
   to accept free text, because a dialect or an internal label is a legitimate answer that no
   published dataset is ever going to contain.

   The panel opens INLINE, pushing the fields below it down, rather than floating above them.
   .mb is the modal's scroll container, so an absolutely-positioned panel gets clipped by its
   overflow the moment the picker sits anywhere near the bottom of a tall form. */
function comboHTML(o){
  return `<div class="cb" data-cb="${esc(o.name)}">
    <input type="hidden" name="${esc(o.name)}" value="${esc(o.value || "")}">
    <button type="button" class="cbtn" aria-haspopup="listbox" aria-expanded="false">
      <span class="cv ph"><span class="t">${esc(o.placeholder || "Choose…")}</span></span>
      <span class="cx" title="Clear" hidden><i data-lucide="x"></i></span>
      <i data-lucide="chevron-down" class="cvi"></i>
    </button>
    <div class="cpop">
      <div class="csr"><i data-lucide="search"></i>
        <input type="text" autocomplete="off" spellcheck="false" placeholder="${esc(o.search || "Search…")}"></div>
      <div class="clist" role="listbox"></div>
    </div>
  </div>`;
}

/* An item is { v, label, sub, lead, hay, group }: `lead` is a flag or brand mark, `hay` is the
   lowercase text it matches on, `group` is the heading it sits under. Items must already be in
   the order they should appear — the drawer only inserts a heading when `group` changes. */
const CAP = 60;                                         // rows drawn at once; the rest need typing
function wireCombo(root, o){
  const cb = root.querySelector(`[data-cb="${o.name}"]`);
  if(!cb) return null;
  const hid = cb.querySelector("input[type=hidden]"), btn = cb.querySelector(".cbtn");
  const cv = cb.querySelector(".cv"), cx = cb.querySelector(".cx");
  const pop = cb.querySelector(".cpop"), sIn = pop.querySelector("input"), list = pop.querySelector(".clist");
  let items = (o.items || []).slice(), rows = [], cur = -1;

  const isOpen = () => cb.classList.contains("open");
  const opts = () => [...list.querySelectorAll(".copt")];
  const find = v => items.find(i => i.v === v);

  function paintValue(){
    const v = hid.value, it = find(v);
    const lab = it ? it.label : v;
    cv.className = "cv" + (lab ? "" : " ph");
    cv.innerHTML = lab
      ? (it && it.lead ? it.lead : "") + `<span class="t">${esc(lab)}</span>` +
        (it && it.sub ? `<span class="sub">${esc(it.sub)}</span>` : "")
      : `<span class="t">${esc(o.placeholder || "Choose…")}</span>`;
    cx.hidden = !v;
    wireLogos(cv);
  }
  function draw(){
    const q = key(sIn.value);
    const all = q ? items.filter(i => i.hay.indexOf(q) !== -1) : items;
    rows = all.slice(0, CAP);
    let html = "", g = null;
    rows.forEach((i, n) => {
      if((i.group || "") !== g){ g = i.group || ""; if(g) html += `<div class="cgh">${esc(g)}</div>`; }
      html += `<button type="button" class="copt${i.v === hid.value ? " sel" : ""}" data-i="${n}">
        ${i.lead || ""}<span class="t">${esc(i.label)}</span>
        ${i.sub ? `<span class="s">${esc(i.sub)}</span>` : ""}
        <i data-lucide="check" class="ck"></i></button>`;
    });
    /* Anything typed that is not on the list is still a valid answer when free text is on —
       offered explicitly, so picking it is a decision rather than an accident. */
    const typed = sIn.value.trim();
    const free = o.allowFree && typed && !all.some(i => key(i.label) === q);
    if(free) html += `<button type="button" class="copt add" data-free="1">
      <i data-lucide="corner-down-left"></i><span class="t">Use “${esc(typed)}” as typed</span></button>`;
    if(!rows.length && !free) html += `<div class="cnone">${esc(o.empty || "Nothing matches that.")}</div>`;
    else if(all.length > rows.length) html += `<div class="cnone">${all.length - rows.length} more — keep typing to narrow it down.</div>`;
    list.innerHTML = html;
    icons(list); wireLogos(list);
    cur = -1;
  }
  function highlight(n){
    const els = opts();
    if(!els.length) return;
    cur = (n + els.length) % els.length;
    els.forEach((e, i) => e.classList.toggle("cur", i === cur));
    try{ els[cur].scrollIntoView({ block:"nearest" }); }catch(e){}
  }
  function activate(el){
    if(!el) return;
    api.set(el.dataset.free ? sIn.value.trim() : rows[+el.dataset.i].v);
    close(); btn.focus();
  }
  function show(){
    if(isOpen()) return;
    cb.classList.add("open"); btn.setAttribute("aria-expanded", "true");
    sIn.value = ""; draw();
    setTimeout(() => sIn.focus(), 20);
    /* the panel pushes the rest of the form down, so make sure it is actually on screen */
    setTimeout(() => { try{ pop.scrollIntoView({ block:"nearest", behavior:"smooth" }); }catch(e){} }, 70);
  }
  function close(){ cb.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }

  const api = {
    el:cb,
    get value(){ return hid.value; },
    /* quiet = the caller is reflecting a change it already knows about, so no onPick echo */
    set(v, quiet){
      hid.value = v == null ? "" : String(v);
      paintValue();
      if(!quiet && o.onPick) o.onPick(hid.value);
    },
    setItems(next){ items = (next || []).slice(); paintValue(); if(isOpen()) draw(); },
  };

  btn.onclick = e => {
    if(e.target.closest(".cx")){ api.set(""); close(); return; }
    isOpen() ? close() : show();
  };
  sIn.oninput = draw;
  list.onclick = e => { const el = e.target.closest(".copt"); if(el) activate(el); };
  cb.addEventListener("keydown", e => {
    if(!isOpen()){
      if(e.key === "ArrowDown" && document.activeElement === btn){ e.preventDefault(); show(); }
      return;
    }
    /* Escape closes the picker, never the modal behind it; Enter picks, never submits. */
    if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); highlight(cur + 1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); highlight(cur - 1); }
    else if(e.key === "Enter"){
      e.preventDefault(); e.stopPropagation();
      const els = opts();
      activate(cur >= 0 ? els[cur] : els[0]);
    }
  });

  paintValue();
  return api;
}
/* clicking anywhere else closes whichever picker is open */
document.addEventListener("click", e => {
  document.querySelectorAll(".cb.open").forEach(cb => {
    if(!cb.contains(e.target)) cb.classList.remove("open");
  });
});

/* ── the two item lists, built from the catalog ── */
function countryItems(){
  return GEO.countries.map(c => ({
    v:c.code, label:c.name, sub:contName(c.continent),
    lead:flagBox(c.code),
    hay:key(c.name + " " + c.native + " " + c.code + " " + contName(c.continent) + " " + c.langs.join(" ")),
    group:"",
  }));
}
/* The languages of the chosen country are pinned above the full list — that is the whole
   "Vietnam ⇒ Vietnamese" idea made visible, without taking the other 184 away. */
function languageItems(code, used){
  const spoken = langsOfCountry(code);
  const seen = new Set();
  const one = (nm, native, group) => {
    if(!nm || seen.has(nm)) return null;
    seen.add(nm);
    return { v:nm, label:nm, sub:native && native !== nm ? native : "",
             hay:key(nm + " " + (native || "")), group };
  };
  const nat = nm => { const l = GEO.languages.find(x => x.name === nm); return l ? l.native : ""; };
  return [
    ...spoken.map(nm => one(nm, nat(nm), code ? "Spoken in " + regionName(code) : "")),
    ...(used || []).map(nm => one(nm, nat(nm), "Already in this organization")),
    ...GEO.languages.map(l => one(l.name, l.native, "All languages")),
  ].filter(Boolean);
}

/* ═══════════════════ admin ═══════════════════ */
function setUnlocked(v){
  unlocked = v;
  if(!v) sessionStorage.removeItem("orghub.key");
  sessionStorage.setItem("orghub.unlocked", v ? "1" : "0");
  render();
}
function lockUI(){
  if(unlocked){ setUnlocked(false); toast("Locked — the page is read-only now", "lock"); return; }
  if(cloud.mode === "offline"){
    openModal(`
      <div class="mh"><h3><i data-lucide="cloud-off"></i>Database is offline</h3>${X}</div>
      <div class="mb"><div class="note warn"><i data-lucide="info"></i><span>Editing is disabled until the
        database is reachable again — not because anything is lost, but because a change saved now
        could not be written to it, and a copy built up here could later overwrite the real
        directory.<br><br><b>Nothing has been deleted.</b> ${cloud.cachedAt
          ? "The page is showing the last copy this browser received."
          : "This browser has no copy to show."}</span></div></div>
      <div class="mf"><button class="b" data-close>Close</button>
        <button class="b p" id="rc"><i data-lucide="refresh-cw"></i> Try again</button></div>`, { focus:null });
    const rc = mo.querySelector("#rc");
    rc.onclick = async () => {
      rc.disabled = true; rc.innerHTML = `<i data-lucide="loader"></i> Checking…`; icons(rc);
      if(await tryReconnect()) return closeModal();
      rc.disabled = false; rc.innerHTML = `<i data-lucide="refresh-cw"></i> Try again`; icons(rc);
      toast("Still cannot reach the database", "cloud-off");
    };
    return;
  }
  if(cloud.mode === "cloud" && !cloud.adminReady){
    return openModal(`
      <div class="mh"><h3><i data-lucide="triangle-alert"></i>Admin password not set</h3>${X}</div>
      <div class="mb"><div class="note warn"><i data-lucide="info"></i><span>Cloud storage is connected, but no
        <b>ADMIN_PASSWORD</b> environment variable exists on this deployment — so editing is disabled for everybody.
        Add it in Vercel → Project → Settings → Environment Variables, then redeploy.</span></div></div>
      <div class="mf"><button class="b p" data-close>Got it</button></div>`, { focus:null });
  }
  if(cloud.mode === "local" && !state.settings.passHash) return passwordModal(true);

  openModal(`
    <div class="mh"><h3><i data-lucide="shield-check"></i>Admin sign in</h3>${X}</div>
    <form><div class="mb">
      <div class="f"><label>Admin password</label>
        <input type="password" name="p" placeholder="Enter password" autocomplete="current-password">
        <div class="hint">${cloud.mode === "cloud"

          : "Stored only in this browser. Without it the page is read-only."}</div></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p"><i data-lucide="lock-open"></i> Unlock</button></div></form>`, {
    onSubmit: async f => {
      const pw = f.p.value;
      if(cloud.mode === "cloud"){
        try{
          const r = await fetch("api/auth", { method:"POST", headers:{ "Content-Type":"application/json" },
                                              body:JSON.stringify({ password:pw }) });
          const j = await r.json().catch(() => ({}));
          if(!r.ok || !j.ok) return showErr(j.error || "Wrong password.");
          sessionStorage.setItem("orghub.key", pw);
        }catch(e){ return showErr("Could not reach the server. Check your connection."); }
      }else{
        if(await sha(pw) !== state.settings.passHash) return showErr("Wrong password.");
      }
      closeModal(); setUnlocked(true); toast("Admin unlocked", "lock-open");
    }
  });
}
function passwordModal(first){
  if(cloud.mode === "cloud"){
    return openModal(`
      <div class="mh"><h3><i data-lucide="key-round"></i>Admin password</h3>${X}</div>
      <div class="mb"><div class="note"><i data-lucide="info"></i><span>In cloud mode the password lives on the
        server as the <b>ADMIN_PASSWORD</b> environment variable — it is never stored in the browser.
        To change it: Vercel → Project → Settings → Environment Variables → edit <b>ADMIN_PASSWORD</b> → Redeploy.</span></div></div>
      <div class="mf"><button class="b p" data-close>Got it</button></div>`, { focus:null });
  }
  const has = !!state.settings.passHash;
  openModal(`
    <div class="mh"><h3><i data-lucide="key-round"></i>${first ? "Create admin password" : "Change password"}</h3>${X}</div>
    <form><div class="mb">
      ${first ? `<div class="note" style="margin-bottom:16px"><i data-lucide="info"></i><span>Saved in this browser
        as a one-way hash. Write it down — it cannot be recovered.</span></div>` : ""}
      ${has ? `<div class="f"><label>Current password</label><input type="password" name="old"></div>` : ""}
      <div class="f"><label>New password</label><input type="password" name="a"></div>
      <div class="f"><label>Repeat password</label><input type="password" name="b"></div>
    </div>

    onSubmit: async f => {

      if(f.a.value.length < 4) return showErr("Use at least 4 characters.");
      if(f.a.value !== f.b.value) return showErr("The passwords don't match.");
      state.settings.passHash = await sha(f.a.value);
      writeLocal(); closeModal(); setUnlocked(true);
      toast(first ? "Password set — you're signed in" : "Password updated", "shield-check");
    }
  });
}

function socialForm(oid, sid, focusSel){

  /* A channel's platform id can point at nothing (an import from elsewhere, or a platform
     deleted after the fact — the delete guard stops new orphans, but old data can predate it).
     Without an explicit placeholder, NO <option> ends up selected and the browser just shows
     whichever platform is first in the list — so saving with the dropdown untouched would
     silently rewrite the channel onto that unrelated platform. */
  const orphan = s && !state.settings.platforms.some(p => p.id === s.platform);
  const opts = (orphan ? `<option value="${esc(s.platform)}" selected disabled>Unknown platform (${esc(s.platform)})</option>` : "") +
    state.settings.platforms
      .map(p => `<option value="${esc(p.id)}"${s && s.platform === p.id ? " selected" : ""}>${esc(p.name)}</option>`).join("");
  /* the languages this organization already uses, pinned near the top of the language list */
  const used = languagesOf(o).map(x => x.lang).filter(Boolean);
  openModal(`
    <div class="mh"><h3><i data-lucide="share-2"></i>${s ? "Edit channel" : "Add social channel"}</h3>${X}</div>
    <form><div class="mb">
      <div class="g2">
        <div class="f"><label>Platform</label>
          <select name="platform">${opts}<option value="__new">＋ Add a new platform…</option></select></div>
        <div class="f"><label>Handle</label>
          <input type="text" name="handle" value="${esc(s ? s.handle : "")}" placeholder="@aikomedia"></div>
      </div>
      <div class="f np" id="np" hidden>
        <label>New platform</label>
        <div style="display:flex;gap:9px;align-items:center">
          <span class="chip lgc" id="pprev" style="--c:#5b6bff"><span class="ini" style="display:block">?</span></span>
          <input type="text" name="pname" placeholder="Jalo, Kwai, Bluesky…" style="flex:1;min-width:0">
          <input type="color" name="pcolor" value="#5b6bff" title="Brand colour"
            style="width:46px;flex:none;padding:0;border:1px solid var(--ln);border-radius:11px;background:none;cursor:pointer">
        </div>
        <div class="hint"><b>The logo is fetched for you.</b> Type the channel URL below and its
          site's own icon becomes this platform's logo — nothing to upload, no key needed.</div>
      </div>

      <!-- Region and language each take a full row rather than sharing one. Both carry a
           flag or a native spelling beside the name, which a half-width cell truncates, and
           the picker's panel opens inline underneath — in a two-column row that leaves the
           other half standing empty for as long as the list is open. -->
      <div class="f"><label>Region</label>${comboHTML({
        name:"region", value:s ? s.region || "" : "",
        placeholder:"No region", search:"Search countries…" })}</div>
      <div class="f"><label>Language</label>${comboHTML({
        name:"language", value:s ? s.language || "" : "",
        placeholder:"Not set", search:"Search or type a language…" })}
        <div class="hint" id="rlhint"></div></div>

      <div class="f"><label>Channel URL *</label>
        <input type="text" name="url" value="${esc(s ? s.url : "")}" placeholder="instagram.com/aikomedia">
        <div class="hint">https:// is added automatically. Several pages on the same platform, one
          per market, is exactly the point — that is what the region and language above are for.</div></div>
      <div class="f"><label>Note</label>
        <input type="text" name="note" value="${esc(s ? s.note || "" : "")}" placeholder="Agency-managed, seasonal…"></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p">${s ? "Save" : "Add channel"}</button></div></form>`, {
    focus:focusSel || "select",
    onSubmit: async f => {
      const url = safeUrl(f.url.value);
      if(!url) return showErr("Please enter the channel URL.");

      let pid = f.platform.value, merged = "";
      if(pid === "__new"){
        const nm = f.pname.value.trim();
        if(!nm) return showErr("Give the new platform a name.");
        /* reuse an existing platform of the same name rather than making a twin */
        const twin = state.settings.platforms.find(p => p.name.toLowerCase() === nm.toLowerCase());
        if(twin){ pid = twin.id; merged = twin.name; }
        else{
          pid = (nm.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 14) || "plat") + "-" + uid().slice(0, 3);
          state.settings.platforms.push({ id:pid, name:nm, color:f.pcolor.value, icon:autoIcon(nm, url) });
        }
      }

      /* canonLang folds "vietnam", "tiếng việt" and "Vietnamese" onto one spelling — two
         spellings of one language would otherwise cluster into two separate groups */
      const d = { platform:pid,
                  region:String(f.region.value || "").trim().toUpperCase(),
                  language:canonLang(f.language.value),

         picked is quietly ignored and it looks like a new platform was created */
      const msg = merged ? `Added to the existing “${merged}” platform`
