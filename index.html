      if(await commit(msg, merged ? "merge" : "share-2")) checkLinks(o, [url]);
    }
  });

  /* ── region ⇄ language, each filling the other in ──────────────────────────────────
     Picking Vietnam sets the language to Vietnamese, because that is a fact about Vietnam
     rather than something anybody should have to remember. It runs one way only when the
     other field is empty (or still holds a value this same auto-fill put there) — a language
     somebody chose on purpose is never overwritten. The reverse only fires for languages
     exactly one country speaks, so English never guesses a country.                       */
  const hintEl = mo.querySelector("#rlhint");
  let autoLang = "", autoReg = "";
  const setHint = html => { hintEl.innerHTML = html || ""; };

  const langCombo = wireCombo(mo, {
    name:"language", allowFree:true,
    items:languageItems(s ? s.region : "", used),
    placeholder:"Not set", search:"Search or type a language…",
    empty:"No language matches — type it in full and pick “use as typed”.",
    onPick(v){
      autoLang = "";                                     // a deliberate choice from here on
      if(!v) return setHint("");
      const sole = soleCountryFor(v);
      if(sole && (!regCombo.value || regCombo.value === autoReg)){
        autoReg = sole;
        regCombo.set(sole, true);
        langCombo.setItems(languageItems(sole, used));
        return setHint(`Region set to <b>${esc(regionName(sole))}</b> — the only country that speaks ${esc(v)}.`);
      }
      setHint("");
    },
  });
  const regCombo = wireCombo(mo, {
    name:"region",
    items:countryItems(),
    placeholder:"No region", search:`Search ${GEO.countries.length || ""} countries…`.replace("  ", " "),
    empty:"No country matches that.",
    onPick(v){
      autoReg = "";
      langCombo.setItems(languageItems(v, used));
      if(!v) return setHint("");
      const spoken = langsOfCountry(v);
      if(spoken.length && (!langCombo.value || langCombo.value === autoLang)){
        autoLang = spoken[0];
        langCombo.set(autoLang, true);
        return setHint(`Language set to <b>${esc(autoLang)}</b> — ${esc(regionName(v))}'s language.` +
          (spoken.length > 1 ? ` It also speaks ${esc(spoken.slice(1).join(", "))}.` : ""));
      }
      setHint(spoken.length > 1
        ? `${esc(regionName(v))} speaks ${esc(spoken.join(", "))}.` : "");
    },
  });

  /* the new-platform block only exists once "+ Add a new platform…" is picked */
  const sel = mo.querySelector("[name=platform]"), np = mo.querySelector("#np");
  const prev = mo.querySelector("#pprev"), pc = mo.querySelector("[name=pcolor]");
  sel.onchange = () => {
    np.hidden = sel.value !== "__new";
    if(!np.hidden) setTimeout(() => mo.querySelector("[name=pname]").focus(), 40);
  };
  pc.oninput = () => prev.style.setProperty("--c", pc.value);
  /* live logo preview: the moment there is a usable URL, show the mark we would store */
  const paintPrev = () => {
    const nm = mo.querySelector("[name=pname]").value.trim();
    prev.innerHTML = iconOf(autoIcon(nm, safeUrl(mo.querySelector("[name=url]").value)), initials(nm || "?"));
    icons(prev); wireLogos(prev);
  };
  mo.querySelector("[name=pname]").oninput = paintPrev;
  mo.querySelector("[name=url]").oninput = () => { if(!np.hidden) paintPrev(); };
}

/* ═══════════════════ link health checker ═══════════════════ */
const hkey = u => safeUrl(u);
function hstate(u){
  const h = health[hkey(u)];
  if(!h) return { cls:"", txt:"Not checked yet" };
  const age = Date.now() - (h.at || 0);
  const when = age < 60e3 ? "just now" : age < 3600e3 ? Math.round(age / 60e3) + "m ago" : Math.round(age / 3600e3) + "h ago";
  if(h.ok)          return { cls:"ok",   txt:`Live · HTTP ${h.status} · ${h.ms}ms · checked ${when}` };
  if(h.status === 403 || h.status === 0 && h.note === "Blocked") return { cls:"warn", txt:`${h.note} · checked ${when}` };
  return { cls:"bad", txt:`${h.note || "HTTP " + h.status} · checked ${when}` };
}
function allUrls(o){
  return [...o.websites.map(w => safeUrl(w.url)), ...o.socials.map(s => safeUrl(s.url))].filter(Boolean);
}
async function checkLinks(o, only){
  if(!location.protocol.startsWith("http")){
    if(!only) toast("Link checking needs the deployed site (it runs on the server)", "info");
    return;
  }
  const urls = (only || allUrls(o)).filter(Boolean);
  if(!urls.length) return;
  urls.forEach(u => checking.add(u));
  paintDots();
  try{
    const r = await fetch("api/check", { method:"POST", headers:{ "Content-Type":"application/json" },
                                         body:JSON.stringify({ urls }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "check failed");
    j.results.forEach(x => { health[hkey(x.url)] = { ok:x.ok, status:x.status, ms:x.ms, note:x.note, at:Date.now() }; });
    saveHealth();
    const bad = j.results.filter(x => !x.ok).length;
    if(!only) toast(bad ? `${bad} of ${j.results.length} link(s) need attention` : `All ${j.results.length} links are live`,
                    bad ? "triangle-alert" : "check-check");
  }catch(e){
    if(!only) toast("Link check unavailable (deploy the site to use it)", "triangle-alert");
  }finally{
    urls.forEach(u => checking.delete(u));
    render();
  }
}
function paintDots(){
  document.querySelectorAll("[data-h]").forEach(el => {
    const u = el.dataset.h;
    if(checking.has(u)){ el.className = "hd-dot spin"; el.title = "Checking…"; return; }
    const h = hstate(u); el.className = "hd-dot " + h.cls; el.title = h.txt;
  });
}
function healthSummary(o){
  const u = allUrls(o);
  let ok = 0, bad = 0, un = 0;
  u.forEach(x => { const h = health[hkey(x)]; if(!h) un++; else if(h.ok) ok++; else bad++; });
  return { total:u.length, ok, bad, un };
}
/* auto-check the open org when the cache has gone stale */
function autoCheck(o){
  if(!o || cloud.mode !== "cloud") return;
  const stale = allUrls(o).filter(u => { const h = health[hkey(u)]; return !h || Date.now() - h.at > HTTL; });
  if(stale.length) checkLinks(o, stale);
}

/* Name, brand colour and logo of one platform — reachable from Settings, and the only
   place a platform created on the fly can be corrected afterwards. */
function platformForm(pid, back){
  const p = state.settings.platforms.find(x => x.id === pid);
  if(!p) return;
  const isImg = String(p.icon || "").startsWith("img:");
  openModal(`
    <div class="mh"><h3><i data-lucide="palette"></i>Edit platform</h3>${X}</div>
    <form><div class="mb">
      <div style="display:flex;gap:13px;align-items:center;margin-bottom:17px">
        <span class="chip lgc" id="pprev" style="--c:${esc(p.color || "#5b6bff")}">${iconOf(p.icon, initials(p.name))}</span>
        <div class="hint" style="margin:0">This is exactly how it appears on the group header.</div>
      </div>
      <div class="g2">
        <div class="f"><label>Name</label><input type="text" name="name" value="${esc(p.name)}"></div>
        <div class="f"><label>Brand colour</label>
          <input type="color" name="color" value="${esc(p.color || "#5b6bff")}"
            style="width:100%;height:43px;padding:2px;border:1px solid var(--ln);border-radius:11px;background:none;cursor:pointer"></div>
      </div>
      <div class="f"><label>Logo URL <span style="font-weight:400;text-transform:none">— optional</span></label>
        <input type="text" name="logo" value="${esc(isImg ? p.icon.slice(4) : "")}"
          placeholder="Empty = use the built-in brand icon">
        <div class="hint">Any image URL works. Platforms you add yourself get their own site's
          icon here automatically — this is where you can swap it for a better one.</div></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p">Save platform</button></div></form>`, {
    onSubmit: async f => {
      const nm = f.name.value.trim();
      if(!nm) return showErr("Please give the platform a name.");
      const logo = safeUrl(f.logo.value.trim());
      p.name = nm;
      p.color = f.color.value;
      if(logo) p.icon = "img:" + logo;
      else if(isImg) p.icon = autoIcon(nm, "");        // cleared the image: fall back to the brand icon
      closeModal();
      await commit("Platform updated", "palette");
      if(back) settingsModal();
    }
  });
  /* this modal is only ever reached from Settings, so backing out of it should land back
     there rather than dumping the admin on the page with their place lost */
  if(back){
    const goBack = () => { closeModal(); settingsModal(); };
    mo.querySelectorAll("[data-close]").forEach(b => b.onclick = goBack);
    onEsc = onVeil = goBack;
  }
  const prev = mo.querySelector("#pprev");
  const repaint = () => {
    const nm = mo.querySelector("[name=name]").value.trim();
    const logo = safeUrl(mo.querySelector("[name=logo]").value.trim());
    prev.style.setProperty("--c", mo.querySelector("[name=color]").value);
    prev.innerHTML = iconOf(logo ? "img:" + logo : p.icon, initials(nm || "?"));
    icons(prev); wireLogos(prev);
  };
  mo.querySelectorAll("[name=name],[name=color],[name=logo]").forEach(el => el.oninput = repaint);
}

/* The daily copies /api/keepalive leaves behind. Restoring one is a full overwrite, so it goes
   through the same PUT that every other save uses — password, conflict check and all — and the
   confirm shows both sides of the trade rather than asking an abstract question. */
async function snapshotsModal(){
  openModal(`
    <div class="mh"><h3><i data-lucide="history"></i>Daily snapshots</h3>${X}</div>
    <div class="mb"><div id="snaplist" class="hint">Loading…</div></div>
    <div class="mf"><button class="b" data-close>Close</button></div>`, { wide:true, focus:null });

  const box = mo.querySelector("#snaplist");
  let list = [];
  try{
    const r = await fetch("api/snapshots", { cache:"no-store" });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "could not read snapshots");
    list = j.snapshots || [];
  }catch(e){
    box.innerHTML = `<div class="note warn"><i data-lucide="triangle-alert"></i><span>
      Could not read the snapshots: ${esc(String(e.message || e))}</span></div>`;
    return icons(box);
  }

  const live = state.orgs.reduce((a, o) => a + o.socials.length, 0);
  box.className = "";
  box.innerHTML = !list.length
    ? `<div class="empty"><div class="e"><i data-lucide="history"></i></div><b>No snapshots yet</b>
       The first one is written by the nightly job. Nothing is missing — this only means it has
       not run since the feature went live.</div>`
    : `<div class="hint" style="margin:0 0 12px">Live right now: <b style="color:var(--tx)">${state.orgs.length}</b>
         organization(s) · <b style="color:var(--tx)">${live}</b> channel(s). Restoring replaces all of it.</div>`
      + list.map(x => `<div class="pr" style="gap:12px">
          <span style="flex:1;min-width:0">
            <span style="display:block;font-weight:650;font-size:13.5px">${esc(x.day)}
              <span style="color:var(--tx3);font-weight:500">· ${esc(new Date(x.updatedAt).toLocaleString())}</span></span>
            <span style="display:block;font-size:12px;color:var(--tx2)">${x.orgs} org(s) · ${x.channels} channel(s)${
              x.channels === live ? "" : ` · <b style="color:var(--amb)">${x.channels > live ? "+" : ""}${x.channels - live}</b> vs live`}</span>
          </span>
          <button class="b s" data-restore="${x.slot}"><i data-lucide="rotate-ccw"></i> Restore</button>
        </div>`).join("");
  icons(box);

  box.querySelectorAll("[data-restore]").forEach(b => b.onclick = async () => {
    const slot = b.dataset.restore, meta = list.find(x => String(x.slot) === String(slot));
    b.disabled = true;
    let snap;
    try{
      const r = await fetch("api/snapshots?slot=" + encodeURIComponent(slot), { cache:"no-store" });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || "could not read that snapshot");
      snap = j;
    }catch(e){ b.disabled = false; return toast(String(e.message || e), "triangle-alert"); }

    const ok = await confirmBox("Restore this snapshot?",
      `<div class="note bad" style="margin-bottom:12px"><i data-lucide="triangle-alert"></i><span>
         This <b>replaces the live directory for everyone</b>. Anything added since
         ${esc(new Date(meta.updatedAt).toLocaleString())} is lost.</span></div>
       <table style="width:100%;font-size:13.5px;line-height:2">
         <tr><td style="color:var(--tx2)">Live now</td>
             <td align="right"><b>${state.orgs.length}</b> orgs · <b>${live}</b> channels</td></tr>
         <tr><td style="color:var(--tx2)">${esc(meta.day)}'s snapshot</td>
             <td align="right"><b>${meta.orgs}</b> orgs · <b>${meta.channels}</b> channels</td></tr>
       </table>
       <div class="hint">Export a backup first if you are unsure — tonight's snapshot will
         overwrite this same weekday's copy.</div>`);
    if(!ok){ b.disabled = false; return; }

    state = normalize(snap.data);
    selected = state.orgs.length ? state.orgs[0].id : null;
    closeModal();
    await commit(`Restored ${meta.day}'s snapshot`, "rotate-ccw");
  });
}

function settingsModal(){
  const s = state.settings;
  const localCount = (() => { try{ const d = JSON.parse(localStorage.getItem(LKEY) || "null"); return d && d.orgs ? d.orgs.length : 0; }catch(e){ return 0; } })();
  /* Channels whose note is really a language. Before this field existed the note was the
     only place to put one, so most existing directories have them stranded there. */
  const strays = [];
  state.orgs.forEach(o => o.socials.forEach(x => {
    if(langOf(x)) return;
    const g = guessLang(x.note);
    if(g) strays.push({ x, g });
  }));
  /* The same idea for region, which is newer still: every channel predating the field has an
     empty one, and a ".vn" domain or a note saying "vietnamese" already answers the question. */
  const noReg = [];
  state.orgs.forEach(o => o.socials.forEach(x => {
    if(regOf(x)) return;
    const g = guessRegion(x);
    if(g) noReg.push({ o, x, g });
  }));
  const regBlank = state.orgs.reduce((n, o) => n + o.socials.filter(x => !regOf(x)).length, 0);
  openModal(`
    <div class="mh"><h3><i data-lucide="settings-2"></i>Settings</h3>${X}</div>
    <div class="mb">
      <div class="f"><label>Site name</label><input type="text" id="st" value="${esc(s.title)}"></div>
      <div class="f"><label>Accent</label>
        <div class="sws" id="sw">
          ${THEMES.map((t, i) => `<div class="sw ${t.a1 === s.a1 ? "on" : ""}" data-i="${i}"
            style="background:linear-gradient(135deg,${t.a1},${t.a2})"></div>`).join("")}
          <input type="color" id="sc" value="${esc(s.a1)}" title="Custom colour"
            style="width:30px;height:30px;padding:0;border:1px solid var(--ln);border-radius:9px;background:none;cursor:pointer">
        </div></div>
      <div class="sr"><div><div class="t1">Appearance</div><div class="d1">Light or dark</div></div>
        <div class="seg" id="sg">
          <button data-t="light" class="${s.theme === "light" ? "on" : ""}">Light</button>
          <button data-t="dark" class="${s.theme === "dark" ? "on" : ""}">Dark</button></div></div>

      <div class="dv"></div>
      <div class="sr"><div><div class="t1">Storage</div>
        <div class="d1">${cloud.mode === "cloud"
          ? "Cloud — shared across every device" + (cloud.updatedAt ? " · last saved " + new Date(cloud.updatedAt).toLocaleString() : "")
          : "This browser only — not shared"}</div></div>
        ${cloud.mode === "cloud" ? `<span class="sync on"><span class="d"></span>Connected</span>`
          : `<button class="b s p" id="setup"><i data-lucide="cloud-cog"></i> Set up</button>`}</div>
      ${cloud.mode === "cloud" && localCount ? `<div class="sr"><div><div class="t1">Old browser data found</div>
        <div class="d1">${localCount} organization(s) still sit in this browser's local storage</div></div>
        <button class="b s" id="push"><i data-lucide="cloud-upload"></i> Upload to cloud</button></div>` : ""}

      <div class="dv"></div>
      <div class="sr"><div><div class="t1">Social platforms</div><div class="d1">Remove or add your own</div></div></div>
      <div id="pl" style="max-height:200px;overflow:auto"></div>
      <form id="ap" style="display:flex;gap:8px;margin-top:11px">
        <input type="text" id="pn" placeholder="New platform name"
          style="flex:1;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--surf2)">
        <input type="color" id="pc" value="#5b6bff"
          style="width:44px;padding:0;border:1px solid var(--ln);border-radius:10px;background:none;cursor:pointer">
        <button class="b"><i data-lucide="plus"></i></button>
      </form>

      <div class="dv"></div>
      <div class="sr"><div><div class="t1">Admin password</div>
        <div class="d1">${cloud.mode === "cloud" ? "Managed on the server" : "Stored in this browser"}</div></div>
        <button class="b s" id="pw"><i data-lucide="key-round"></i> ${cloud.mode === "cloud" ? "How to change" : "Change"}</button></div>
      ${strays.length ? `<div class="sr"><div><div class="t1">Languages sitting in notes</div>
        <div class="d1">${strays.length} channel${strays.length === 1 ? " has a note that names" : "s have notes that name"}
          a language, but an empty Language field</div></div>
        <button class="b s p" id="fixlang"><i data-lucide="wand-sparkles"></i> Move them over</button></div>` : ""}
      ${noReg.length ? `<div class="sr"><div><div class="t1">Regions that can be worked out</div>
        <div class="d1">${noReg.length} of the ${regBlank} channel${regBlank === 1 ? "" : "s"} with no region
          can be placed from their domain, note or language</div></div>
        <button class="b s p" id="fixreg"><i data-lucide="map-pin"></i> Fill them in</button></div>` : ""}
      <div class="sr"><div><div class="t1">Country &amp; language catalog</div>
        <div class="d1">${GEO.countries.length} countries · ${GEO.languages.length} languages · ${
          GEO.source === "cdn"   ? "just downloaded"
        : GEO.source === "cache" ? "from this browser's cache"
        : GEO.source === "browser" ? "built from the browser — the catalog could not be reached, so continents and some country languages are missing"
        : "not loaded"}</div></div>
        ${GEO.source === "browser" || GEO.source === "cache"
          ? `<button class="b s" id="regeo"><i data-lucide="refresh-cw"></i> Refresh</button>` : ""}</div>
      <div class="sr"><div><div class="t1">Check every link</div><div class="d1">Test all websites and channels of all orgs</div></div>
        <button class="b s" id="ck"><i data-lucide="link-2"></i> Run check</button></div>
      ${cloud.mode === "cloud" ? `<div class="sr"><div><div class="t1">Daily snapshots</div>
        <div class="d1" id="snapd">A copy of the whole directory is kept for each of the last seven days</div></div>
        <button class="b s" id="snapb"><i data-lucide="history"></i> View</button></div>` : ""}
      <div class="sr"><div><div class="t1">Backup</div><div class="d1">Download or restore everything as JSON</div></div>
        <div style="display:flex;gap:8px"><button class="b s" id="ex"><i data-lucide="download"></i> Export</button>
          <button class="b s" id="im"><i data-lucide="upload"></i> Import</button></div></div>
      <div class="sr"><div><div class="t1" style="color:var(--red)">Erase everything</div>
        <div class="d1">Deletes all organizations${cloud.mode === "cloud" ? " from the cloud" : " from this browser"}</div></div>
        <button class="b s d" id="wp"><i data-lucide="trash-2"></i> Reset</button></div>
      <input type="file" id="fi" accept="application/json,.json" hidden>
    </div>
    <div class="mf"><button class="b" data-close>Close</button>
      <button class="b p" id="sv"><i data-lucide="check"></i> Save settings</button></div>`, { wide:true, focus:"#st" });

  let a1 = s.a1, a2 = s.a2, theme = s.theme;
  const prev = () => {
    document.documentElement.style.setProperty("--a1", a1);
    document.documentElement.style.setProperty("--a2", a2);
    document.documentElement.dataset.theme = theme;
  };
  const drawPl = () => {
    const box = mo.querySelector("#pl");
    box.innerHTML = state.settings.platforms.map(p => `
      <div class="pr">
        <span class="chip" style="--c:${esc(p.color)};width:28px;height:28px;border-radius:9px;font-size:10px">
          ${iconOf(p.icon, initials(p.name))}</span>
        <span style="flex:1;font-size:13.5px;font-weight:620;min-width:0;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
        <span class="ct">${state.orgs.reduce((n, o) => n + o.socials.filter(x => x.platform === p.id).length, 0)}</span>
        <button class="b g i s" data-edp="${esc(p.id)}" title="Edit name, colour and logo" data-fb="Edit"><i data-lucide="pencil"></i></button>
        <button class="b g i s d" data-del="${esc(p.id)}" title="Remove" data-fb="X"><i data-lucide="x"></i></button>
      </div>`).join("");
    icons(box); wireLogos(box);
    box.querySelectorAll("[data-edp]").forEach(b => b.onclick = () => platformForm(b.dataset.edp, true));
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if(state.orgs.some(o => o.socials.some(x => x.platform === b.dataset.del)))
        return toast("Channels still use it — remove those first", "triangle-alert");
      state.settings.platforms = state.settings.platforms.filter(p => p.id !== b.dataset.del);
      await persist(); drawPl();
    });
  };
  drawPl();

  mo.querySelector("#ap").onsubmit = async e => {
    e.preventDefault();
    const el = mo.querySelector("#pn"), name = el.value.trim();
    if(!name) return;
    /* same case-insensitive guard the inline flow uses — two platforms of the same name would
       render as two identically-titled groups with the channels split between them, and neither
       could be deleted afterwards while any channel still points at it */
    if(state.settings.platforms.some(p => p.name.toLowerCase() === name.toLowerCase()))
      return toast(`“${name}” already exists`, "triangle-alert");
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 14) || "plat";
    state.settings.platforms.push({ id:slug + "-" + uid().slice(0, 3), name,
      color:mo.querySelector("#pc").value, icon:autoIcon(name, "") });
    await persist(); el.value = ""; drawPl();
    toast(name + " added — open its pencil to set a logo", "plus");
  };
  mo.querySelectorAll("#sw .sw").forEach(el => el.onclick = () => {
    const t = THEMES[+el.dataset.i]; a1 = t.a1; a2 = t.a2;
    mo.querySelectorAll("#sw .sw").forEach(x => x.classList.toggle("on", x === el)); prev();
  });
  mo.querySelector("#sc").oninput = e => {
    a1 = e.target.value; a2 = e.target.value;
    mo.querySelectorAll("#sw .sw").forEach(x => x.classList.remove("on")); prev();
  };
  mo.querySelectorAll("#sg button").forEach(b => b.onclick = () => {
    theme = b.dataset.t;
    mo.querySelectorAll("#sg button").forEach(x => x.classList.toggle("on", x === b)); prev();
  });
  mo.querySelector("#sv").onclick = async () => {
    s.title = mo.querySelector("#st").value.trim() || "Aiko";
    s.a1 = a1; s.a2 = a2; s.theme = theme;
    closeModal(); await commit("Settings saved", "check");
  };
  const setupBtn = mo.querySelector("#setup"); if(setupBtn) setupBtn.onclick = setupModal;
  const snb = mo.querySelector("#snapb"); if(snb) snb.onclick = snapshotsModal;
  mo.querySelector("#pw").onclick = () => passwordModal(false);
  const fx = mo.querySelector("#fixlang");
  if(fx) fx.onclick = async () => {
    /* every row is listed, never a truncated sample — the guesses are fuzzy and this applies
       to all of them at once, so the admin has to be able to see everything they are approving */
    const rows = strays
      .map(s => `<div><b style="color:var(--tx)">${esc(s.x.note)}</b> → ${esc(s.g)}</div>`).join("");
    const ok = await confirmBox("Move these notes into Language?",
      `<div style="max-height:200px;overflow:auto;line-height:1.85">${rows}</div>
       <div style="margin-top:12px">Each note is cleared once its language is set. Anything that
         is not a language — "Agency-managed", "Largest by subs" — is left exactly as it is.</div>`, false);
    if(!ok) return;
    strays.forEach(s => { s.x.language = s.g; s.x.note = ""; });
    closeModal();
    await commit(strays.length + " language" + (strays.length === 1 ? "" : "s") + " filled in", "wand-sparkles");
  };
  const fr = mo.querySelector("#fixreg");
  if(fr) fr.onclick = async () => {
    /* Same contract as the language pass: every row is listed rather than a sample, because
       these are guesses and the admin has to see all of what they are approving. The note is
       left alone here — unlike a language, a region never lived in it. */
    const rows = noReg.map(r => `<div style="display:flex;align-items:center;gap:8px">
      ${flagBox(r.g)}<b style="color:var(--tx);font-weight:650">${esc(regionName(r.g))}</b>
      <span style="color:var(--tx3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        ${esc(r.o.name)} · ${esc(r.x.handle || pretty(r.x.url))}</span></div>`).join("");
    const ok = await confirmBox("Set these regions?",
      `<div style="max-height:230px;overflow:auto;line-height:1.9">${rows}</div>
       <div style="margin-top:12px">Worked out from each channel's own domain, note or language.
         Anything that could belong to more than one country — an English page, a .com domain —
         is left empty rather than guessed.</div>`, false);
    if(!ok) return;
    noReg.forEach(r => { r.x.region = r.g; });
    closeModal();
    await commit(noReg.length + " region" + (noReg.length === 1 ? "" : "s") + " filled in", "map-pin");
  };
  const rg = mo.querySelector("#regeo");
  if(rg) rg.onclick = async () => {
    /* drop the cache so loadGeo has to go back out to the CDN rather than re-reading it */
    try{ localStorage.removeItem(GKEY); }catch(e){}
    toast("Fetching the catalog…", "loader");
    await loadGeo();
    closeModal(); render();
    toast(GEO.source === "cdn" ? `Catalog updated · ${GEO.countries.length} countries`
                               : "Still could not reach the catalog", GEO.source === "cdn" ? "check" : "triangle-alert");
  };
  mo.querySelector("#ck").onclick = async () => {
    closeModal();
    const urls = [...new Set(state.orgs.flatMap(allUrls))];
    if(!urls.length) return toast("Nothing to check yet", "info");
    toast(`Checking ${urls.length} link(s)…`, "loader");
    urls.forEach(u => checking.add(u)); paintDots();
    for(let i = 0; i < urls.length; i += 30){
      await checkLinks({ websites:[], socials:[] }, urls.slice(i, i + 30));
    }
    const bad = urls.filter(u => health[u] && !health[u].ok).length;
    toast(bad ? `${bad} link(s) need attention` : "All links are live", bad ? "triangle-alert" : "check-check");
  };
  const push = mo.querySelector("#push");
  if(push) push.onclick = async () => {
    const local = readLocal();
    const lc = local.orgs.reduce((n2, o) => n2 + o.socials.length, 0);
    const cc = state.orgs.reduce((n2, o) => n2 + o.socials.length, 0);
    /* This is the only action in the app that can wipe a live directory in one click, and the
       shape that does it is exactly the one an outage produces: a nearly empty browser copy
       sitting next to a full cloud one. Refuse it outright rather than asking nicely. */
    if(lc < cc){
      return toast(`Refused: this browser has ${lc} channel(s), the cloud has ${cc}`, "shield-alert");
    }
    if(!await confirmBox("Replace the cloud directory?",
      `<div class="note bad" style="margin-bottom:12px"><i data-lucide="triangle-alert"></i><span>
         This <b>overwrites</b> what everyone else sees. It cannot be undone from here.</span></div>
       <table style="width:100%;font-size:13.5px;line-height:2">
         <tr><td style="color:var(--tx2)">In the cloud now</td>
             <td align="right"><b>${state.orgs.length}</b> orgs · <b>${cc}</b> channels</td></tr>
         <tr><td style="color:var(--tx2)">This browser will replace it with</td>
             <td align="right"><b>${local.orgs.length}</b> orgs · <b>${lc}</b> channels</td></tr>
       </table>`)) return;
    state = local; closeModal(); await commit("Uploaded to the cloud", "cloud-upload");
  };
  mo.querySelector("#ex").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type:"application/json" }));
    a.download = "aiko-backup.json"; a.click(); URL.revokeObjectURL(a.href);
    toast("Backup downloaded", "download");
  };
  const fi = mo.querySelector("#fi");
  mo.querySelector("#im").onclick = () => fi.click();
  fi.onchange = () => {
    const f = fi.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.orgs)) throw 0;
        if(!await confirmBox("Replace current data?",
          `Your <b>${state.orgs.length}</b> organization(s) will be replaced by <b>${d.orgs.length}</b> from this file.`, false)) return;
        const keep = state.settings.passHash;
        state = normalize(d);
        if(cloud.mode !== "cloud") state.settings.passHash = state.settings.passHash || keep;
        selected = state.orgs.length ? state.orgs[0].id : null;
        closeModal(); await commit("Data imported", "upload");
      }catch(e){ toast("Not a valid Aiko backup file", "triangle-alert"); }
    };
    r.readAsText(f);
  };
  mo.querySelector("#wp").onclick = async () => {
    if(!await confirmBox("Erase everything?",
      `Every organization, website and channel will be permanently deleted${cloud.mode === "cloud" ? " for everyone" : ""}.`)) return;
    const keep = state.settings;
    state = blank(); state.settings = { ...keep, platforms:keep.platforms };
    selected = null; closeModal(); await commit("Everything erased", "trash-2");
  };
}

/* ═══════════════════ render ═══════════════════ */
function paintSync(){
  const el = document.getElementById("sync");
  if(!el) return;
  let cls = "sync", txt = "Local only", tip = "Data is saved in this browser only";
  if(cloud.saving){ cls += " busy"; txt = "Saving…"; tip = "Writing to the cloud"; }
  else if(cloud.mode === "offline"){
    cls += " bad"; txt = "Database offline";
    tip = "The directory is safe in the database — this deployment just cannot reach it right now. "
        + (cloud.cachedAt ? "Showing the last copy this browser received, from "
            + new Date(cloud.cachedAt).toLocaleString() + "." : "Nothing cached in this browser yet.");
  }
  else if(cloud.error){ cls += " warn"; txt = "Not saved"; tip = cloud.error; }
  else if(cloud.mode === "cloud"){ cls += " on"; txt = "Cloud"; tip = "Shared across all devices" + (cloud.updatedAt ? " · saved " + new Date(cloud.updatedAt).toLocaleString() : ""); }
  else{ cls += " warn"; }
  el.className = cls; el.title = tip;
  el.querySelector(".lbl").textContent = txt;
}

function matches(o, q){
  if(!q) return true;
  /* the region is searchable by everything it implies — code, country name and continent —
     so "vietnam", "VN" and "asia" all find the same channels */
  return [o.name, o.notes, ...(o.tags || []),
    ...o.websites.map(w => w.label + " " + w.url),
    ...o.socials.map(s => [platform(s.platform).name, langOf(s), regOf(s), regionName(regOf(s)),
      contName(continentOf(regOf(s))), s.handle, s.url, s.note || ""].join(" "))
  ].join(" ").toLowerCase().includes(q);
}

function render(){
  const s = state.settings;
  document.documentElement.dataset.theme = s.theme;
  document.documentElement.style.setProperty("--a1", s.a1);
  document.documentElement.style.setProperty("--a2", s.a2);
  document.title = s.title + " — websites & social channels";
  document.getElementById("ttl").textContent = s.title;
  paintSync();

  const lk = document.getElementById("lock");
  lk.innerHTML = unlocked ? `<i data-lucide="lock-open"></i> <span>Admin on</span>` : `<i data-lucide="lock"></i> <span>Admin</span>`;
  lk.classList.toggle("p", unlocked);
  document.getElementById("set").style.display = unlocked ? "" : "none";

  const app = document.getElementById("app");
  const q = query.trim().toLowerCase();
  const sorted = state.orgs.slice().sort((a, b) => a.name.localeCompare(b.name));
  const list = sorted.filter(o => matches(o, q));

  if(!list.some(o => o.id === selected)) selected = list.length ? list[0].id : null;

  const tw = state.orgs.reduce((n, o) => n + o.websites.length, 0);
  const tc = state.orgs.reduce((n, o) => n + o.socials.length, 0);

  app.innerHTML = `
    <div class="shell">
      <aside class="card">
        <div class="rail-h"><h2>Organizations <span class="ct">${state.orgs.length}</span></h2>
          ${unlocked ? `<button class="b p s" id="new"><i data-lucide="plus"></i> New</button>` : ""}</div>
        <div class="rail" id="rail"></div>
      </aside>
      <main class="main" id="main"></main>
    </div>`;

  const rail = app.querySelector("#rail");
  rail.innerHTML = list.length ? list.map(o => {
    const h = healthSummary(o);
    const nr = regionsOf(o).filter(x => x.v).length;
    return `<button class="oi ${o.id === selected ? "on" : ""}" data-org="${esc(o.id)}">
      ${logoBox(o)}
      <span style="min-width:0;flex:1">
        <span class="nm">${esc(o.name)}</span>
        <span class="sb">${o.socials.length} channel${o.socials.length === 1 ? "" : "s"}${
          nr ? ` · ${nr} region${nr === 1 ? "" : "s"}` : ""} · ${o.websites.length} site${o.websites.length === 1 ? "" : "s"}</span>
      </span>
      ${h.bad ? `<span class="hd-dot bad" title="${h.bad} broken link(s)"></span>` : ""}
    </button>`; }).join("")
    : `<div class="empty" style="border:0;background:none;padding:26px 12px">
        <div class="e"><i data-lucide="${state.orgs.length ? "search-x" : "building-2"}"></i></div>
        <b>${state.orgs.length ? "No match" : "No organizations"}</b>
        ${state.orgs.length ? "Nothing found for “" + esc(query) + "”." : (unlocked ? "Click <b style='display:inline'>New</b> to add one." : "Unlock admin to add one.")}</div>`;
  rail.querySelectorAll("[data-org]").forEach(b => b.onclick = () => {
    selected = b.dataset.org;
    /* the filters belong to the org you were looking at — carrying them across would silently
       hide channels in the new one, with only a highlighted chip to explain why. The grouping
       is a way of reading rather than a narrowing, so that one does travel. */
    contFilter = regFilter = langFilter = null;
    try{ history.replaceState(null, "", "#/" + selected); }catch(e){}
    render();
  });

  renderMain(org(selected), { tw, tc });
  icons(app); wireLogos(app); paintDots();

  if(!booting && !quiet){
    anim(".oi", { x:-12, opacity:0, stagger:.025, duration:.3 });
    /* the platform groups animate individually, so their section wrapper must not fade too —
       nesting two opacity tweens makes the groups visibly double-dip on every render */
    anim("#main > *:not(.gwrap)", { y:16, opacity:0, stagger:.06, duration:.42 });
    anim(".pg", { y:10, opacity:0, stagger:.04, duration:.36 });
  }
}

function renderMain(o, tot){
  const m = document.getElementById("main");
  if(!m) return;

  /* Three states that used to share one banner. "Not shared yet" is only true when the server
     itself reports no database configured — saying it during an outage tells somebody their
     directory was never saved anywhere, which is both false and frightening. */
  const setupBanner =
    cloud.mode === "offline"
      ? `<div class="note bad"><i data-lucide="cloud-off"></i><span>
          <b>The database cannot be reached right now — nothing has been deleted.</b><br>
          ${cloud.cachedAt
            ? "Below is the last copy this browser received, from <b>"
              + esc(new Date(cloud.cachedAt).toLocaleString()) + "</b>. It is read-only."
            : "This browser has no earlier copy to show, so the page is empty — the directory itself is not."}
          <br><span style="color:var(--tx3)">If this is a free Supabase project it may have been paused;
          restoring it in the Supabase dashboard brings everything straight back.</span></span>
          <button class="b s p" id="retryB"><i data-lucide="refresh-cw"></i> Try again</button></div>`
    : (cloud.mode === "local" && location.protocol.startsWith("http"))
      ? `<div class="note warn"><i data-lucide="cloud-off"></i><span><b>Not shared yet.</b> Data is saved only in
          this browser, so your phone and your teammates see nothing. Connect a free database to fix it.</span>
          <button class="b s p" id="setupB">Set up</button></div>`
    : "";

  if(!o){
    m.innerHTML = setupBanner + `<div class="card" style="padding:56px 24px">
      <div class="empty" style="border:0;background:none;padding:0">
        <div class="e"><i data-lucide="radio-tower"></i></div>
        <b style="font-size:19px">${state.orgs.length ? "Pick an organization" : "Nothing here yet"}</b>
        ${state.orgs.length ? "Choose one on the left to see its websites and channels."
          : (unlocked ? "Add your first organization to get started."
                      : "Press <b style='display:inline'>Admin</b> in the top-right to sign in and add one.")}
        ${!state.orgs.length && unlocked ? `<div style="margin-top:18px"><button class="b p xl" id="first">
          <i data-lucide="plus"></i> Add organization</button></div>` : ""}
      </div></div>`;
    icons(m);
    const b1 = m.querySelector("#first"); if(b1) b1.onclick = () => orgForm();
    const b2 = m.querySelector("#setupB"); if(b2) b2.onclick = setupModal;
    return;
  }

  const h = healthSummary(o);
  const hlab = h.total === 0 ? `<span style="color:var(--tx3)">nothing to check</span>`
    : h.bad ? `<span style="color:var(--red)"><b style="font-size:inherit">${h.bad}</b> need attention</span>`
    : h.un === h.total ? `<span style="color:var(--tx3)">not checked yet</span>`
    : `<span style="color:var(--grn)">all ${h.ok} live</span>`;

  /* ── one row = [ what it is ] · [ the link ] · [ health + actions ] ──────────
     Websites put their label in the first column and channels put their language,
     so both sections read straight down the same three columns.               */
  const actions = (u, key) => `
    <span class="gact">
      <span class="hd-dot" data-h="${esc(u)}"></span>
      <button class="b g i s" data-cp="${esc(u)}" title="Copy link" data-fb="Copy"><i data-lucide="copy"></i></button>
      ${unlocked ? `<button class="b g i s" data-ed="${key}" title="Edit" data-fb="Edit"><i data-lucide="pencil"></i></button>
        <button class="b g i s d" data-rm="${key}" title="Remove" data-fb="Del"><i data-lucide="trash-2"></i></button>` : ""}
    </span>`;

  const linkCell = (u, handle) => `
    <a class="glk" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">
      ${handle ? `<span class="hnd">${esc(handle)}</span>` : ""}
      <span class="u${handle ? "" : " solo"}">${esc(pretty(u))}</span><i data-lucide="arrow-up-right"></i></a>`;

  const webRows = o.websites.map(w => {
    const u = safeUrl(w.url);
    return `<div class="gr" style="--c:hsl(${hue(w.label || u)} 62% 52%)">
      <span class="lang" style="--lc:hsl(${hue(w.label || u)} 62% 52%)"><i></i>${esc(w.label || pretty(u))}</span>
      ${linkCell(u, "")}
      ${actions(u, "w:" + w.id)}
    </div>`;
  }).join("");

  /* ── the three filter tiers ────────────────────────────────────────────────────────
     Each tier narrows the pool the next one is counted from, so the numbers on the chips
     always describe what clicking them would actually produce. A channel with no region or
     no language is a real bucket ("") rather than an absence, which is why "all" is null:
     "everything" and "the ones with none set" must stay tellable apart. */
  const conts = continentsOf(o.socials);
  if(contFilter !== null && !conts.some(x => x.v === contFilter)) contFilter = null;
  const afterCont = contFilter === null ? o.socials : o.socials.filter(s => continentOf(regOf(s)) === contFilter);

  const regs = facet(afterCont, "region");
  if(regFilter !== null && !regs.some(x => x.v === regFilter)) regFilter = null;
  const afterReg = regFilter === null ? afterCont : afterCont.filter(s => regOf(s) === regFilter);

  const langs = facet(afterReg, "language").map(x => ({ lang:x.v, n:x.n }));
  if(langFilter !== null && !langs.some(x => x.lang === langFilter)) langFilter = null;
  const shown = langFilter === null ? afterReg : afterReg.filter(s => langOf(s) === langFilter);

  const allLangs = languagesOf(o), allRegs = regionsOf(o);
  const nrNoReg = (allRegs.find(x => !x.v) || { n:0 }).n;
  const filtered = contFilter !== null || regFilter !== null || langFilter !== null;
  const gm = effMode(o);                                // may differ from groupMode — see effMode

  const chip = (on, attr, val, label, n, lead) =>
    `<button class="lc ${on ? "on" : ""}" data-${attr}="${esc(val)}" title="${esc(label)}">${lead || ""}
      <span class="t">${esc(label)}</span> <span class="n">${n}</span></button>`;

  const tier = (label, attr, sel, total, list) => list.length > 1 ? `
    <div class="frow"><span class="fl">${label}</span><span class="chips">
      ${chip(sel === null, attr, "*", "All", total)}
      ${list.join("")}
    </span></div>` : "";

  const toolbar = o.socials.length ? `
    <div class="tbar">
      <div class="tb-top">
        <span class="tb-l">Group by</span>
        <div class="seg gb" id="gb">${GROUPS.map(g => `<button data-gb="${g.id}"
          class="${gm === g.id ? "on" : ""}"><i data-lucide="${g.icon}"></i>${g.label}</button>`).join("")}</div>
        <span class="tb-n">
          <span>${shown.length === o.socials.length ? `All ${o.socials.length} channels`
            : `${shown.length} of ${o.socials.length} channels`}</span>
          ${filtered ? `<button class="b g s" id="clrf"><i data-lucide="filter-x"></i> Clear</button>` : ""}
        </span>
      </div>
      ${gm !== groupMode ? `<div class="frow"><span class="fl">Region</span><span class="tb-fb">
        <i data-lucide="info"></i><span>No channel here has a region yet, so these are grouped by platform.
        ${unlocked ? `<b style="display:inline">Settings</b> can work most of them out from the
          channel's own domain, note or language.` : "An admin can fill them in."}</span></span></div>` : ""}
      ${tier("Area", "cont", contFilter, o.socials.length,
        conts.map(x => chip(contFilter === x.v, "cont", x.v, contName(x.v), x.n)))}
      ${tier("Region", "reg", regFilter, afterCont.length,
        regs.map(x => chip(regFilter === x.v, "reg", x.v, x.v ? regionName(x.v) : NO_REG, x.n,
          x.v ? flagBox(x.v) : "")))}
      ${tier("Language", "lang", langFilter, afterReg.length,
        langs.map(x => chip(langFilter === x.lang, "lang", x.lang, x.lang || NO_LANG, x.n)))}
    </div>` : "";

  /* ── one group card ──────────────────────────────────────────────────────────────
     The outer group names one dimension, the sub-band names a second, and each row carries
     whichever single dimension is left over. Region leads by default and is the sub-band
     under the other two, so it is never more than one level from the top. */
  const sub = SUBDIM[gm];

  const rowLead = x => {
    if(sub === "language" || gm === "language"){
      /* language is already accounted for above the row — show the platform instead */
      const p = platform(x.platform);
      return `<span class="plt"><span class="chip" style="--c:${esc(p.color)}">${
        iconOf(p.icon, initials(p.name))}</span><span class="t">${esc(p.name)}</span></span>`;
    }
    const l = langOf(x), tint = l ? ` style="--lc:hsl(${hue(l)} 62% 52%)"` : "";
    const pill = `<i></i>${esc(l || NO_LANG)}`;
    return unlocked
      ? `<button class="lang${l ? "" : " none"}"${tint} data-edit-lang="${esc(x.id)}"
          title="${l ? "Change this channel's language" : "No language yet — click to set one"}">${pill}</button>`
      : `<span class="lang${l ? "" : " none"}"${tint}${l ? "" : ` title="No language has been set for this channel"`}>${pill}</span>`;
  };

  const subLabel = v => sub === "region" ? (v ? regionName(v) : NO_REG) : (v || NO_LANG);
  const groupHead = g => {
    const n = g.items.length, nsub = g.sections.length;
    const chans = `${n} channel${n === 1 ? "" : "s"}`;
    /* With one section there is no band inside the card to name it, so the header says it
       instead — otherwise a Vietnam card full of Vietnamese never mentions Vietnamese. An
       unset one is worth no words at all: "No region · 2 channels" on every card of a
       directory that has no regions yet is a fact already stated once, above the whole list. */
    const line = nsub === 1
      ? (g.sections[0].value ? `${subLabel(g.sections[0].value)} · ${chans}` : chans)
      : `${chans} · ${nsub} ${sub}s`;
    if(gm === "region"){
      const cc = g.value;
      /* the continent is only known when the catalog loaded — without it, no dangling "· " */
      const area = cc ? contName(continentOf(cc)) : "";
      return { color:cc ? `hsl(${hue(regionName(cc))} 62% 52%)` : "#64748b",
        mark:flagBox(cc, "xl2"),
        title:cc ? regionName(cc) : NO_REG,
        sub:(area ? area + " · " : "") + line };
    }
    if(gm === "platform"){
      const p = platform(g.value);
      return { color:p.color, mark:`<span class="chip lgc">${iconOf(p.icon, initials(p.name))}</span>`,
               title:p.name, sub:line };
    }
    const l = g.value;
    return { color:l ? `hsl(${hue(l)} 62% 52%)` : "#64748b",
      mark:`<span class="chip lgc"><i data-lucide="languages"></i></span>`,
      title:l || NO_LANG, sub:line };
  };

  const subBand = (g, sec) => {
    /* one section is the whole group — its own heading would just repeat the card's */
    if(g.sections.length < 2) return "";
    const v = sec.value, n = sec.items.length;
    if(sub === "region"){
      return `<div class="lsub">${flagBox(v)}<span class="t${v ? "" : " none"}">${
        esc(v ? regionName(v) : NO_REG)}</span><span class="n">${n}</span></div>`;
    }
    const tint = v ? ` style="--lc:hsl(${hue(v)} 62% 52%)"` : "";
    return `<div class="lsub"><span class="dot${v ? "" : " none"}"${tint}></span>
      <span class="t${v ? "" : " none"}">${esc(v || NO_LANG)}</span><span class="n">${n}</span></div>`;
  };

  const socGroups = clusters(shown, gm).map(g => {
    const h = groupHead(g);
    return `
    <div class="pg" style="--c:${esc(h.color)}">
      <div class="pg-h">
        ${h.mark}
        <span class="pgt">
          <span class="nm">${esc(h.title)}</span>
          <span class="sub">${esc(h.sub)}</span>
        </span>
        <span class="ct">${g.items.length}</span>
      </div>
      ${g.sections.map(sec => subBand(g, sec) + sec.items.map(x => {
        const u = safeUrl(x.url);
        return `<div class="gr">
          ${rowLead(x)}
          ${linkCell(u, x.handle)}
          ${actions(u, "s:" + x.id)}
          ${x.note ? `<span class="gnote">${esc(x.note)}</span>` : ""}
        </div>`;
      }).join("")).join("")}
    </div>`; }).join("");

  m.innerHTML = `
    ${setupBanner}
    ${unlocked ? "" : `<div class="note"><i data-lucide="lock"></i><span><b>Read-only view.</b>
      Nothing here can be added, changed or deleted without the admin password.</span></div>`}

    <div class="card hero">
      <div class="hero-top">
        ${logoBox(o, "xl")}
        <div style="flex:1;min-width:0">
          <h1>${esc(o.name)}</h1>
          <div style="color:var(--tx2);font-size:13px;font-weight:620">
            ${o.websites.length} website${o.websites.length === 1 ? "" : "s"} ·
            ${o.socials.length} social channel${o.socials.length === 1 ? "" : "s"}${
            allRegs.filter(x => x.v).length ? ` · ${allRegs.filter(x => x.v).length} region${
              allRegs.filter(x => x.v).length === 1 ? "" : "s"}` : ""}</div>
          ${o.tags.length ? `<div class="tags">${o.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          ${o.notes ? `<p class="notes">${esc(o.notes)}</p>` : ""}
        </div>
      </div>
      ${allRegs.some(x => x.v) ? `<div class="rstrip">${allRegs.map(x => `
        <button class="rpill ${regFilter === x.v ? "on" : ""}" data-reg="${esc(x.v)}"
          title="${regFilter === x.v ? "Showing only " + esc(x.v ? regionName(x.v) : NO_REG) + " — click to show all"
                                     : "Show only " + esc(x.v ? regionName(x.v) : NO_REG)}">
          ${flagBox(x.v)}<span class="t">${esc(x.v ? regionName(x.v) : NO_REG)}</span>
          <span class="n">${x.n}</span></button>`).join("")}</div>` : ""}
      <div class="tools">
        <button class="b s" id="qr"><i data-lucide="qr-code"></i> QR code</button>
        <button class="b s" id="emb"><i data-lucide="code-xml"></i> Embed</button>
        <button class="b s" id="chk"><i data-lucide="link-2"></i> Check links</button>
        <button class="b s" id="cpall"><i data-lucide="copy"></i> Copy all</button>
        <span class="sp"></span>
        ${unlocked ? `<button class="b s" id="eo"><i data-lucide="pencil"></i> Edit org</button>
          <button class="b s d" id="do"><i data-lucide="trash-2"></i> Delete</button>` : ""}
      </div>
    </div>

    <div class="mrow">
      <div class="m"><span class="ic"><i data-lucide="globe"></i></span>
        <b>${o.websites.length}</b><span>Websites</span></div>
      <div class="m"><span class="ic"><i data-lucide="share-2"></i></span>
        <b>${o.socials.length}</b><span>Social channels</span></div>
      <div class="m"><span class="ic"><i data-lucide="map-pin"></i></span>
        <b>${allRegs.filter(x => x.v).length}</b><span>Regions</span>
        ${nrNoReg ? `<div class="hl" style="color:var(--amb)">${nrNoReg} without one</div>` : ""}</div>
      <div class="m"><span class="ic"><i data-lucide="languages"></i></span>
        <b>${allLangs.filter(x => x.lang).length}</b><span>Languages</span></div>
      <div class="m"><span class="ic"><i data-lucide="activity"></i></span>
        <b>${tot.tw + tot.tc}</b><span>Links tracked (all orgs)</span>
        <div class="hl">${hlab}</div></div>
    </div>

    <div>
      <div class="sec-h"><h3><i data-lucide="globe"></i> Websites <span class="ct">${o.websites.length}</span></h3>
        ${unlocked ? `<button class="b p s" id="aw"><i data-lucide="plus"></i> Add website</button>` : ""}</div>
      ${o.websites.length ? `<div class="pg">${webRows}</div>`
        : `<div class="empty"><div class="e"><i data-lucide="globe"></i></div><b>No websites yet</b>
           ${unlocked ? "Main site, blog, landing pages — add as many as you need." : "Nothing added yet."}</div>`}
    </div>

    <div class="gwrap">
      <div class="sec-h"><h3><i data-lucide="share-2"></i> Social channels <span class="ct">${o.socials.length}</span></h3>
        ${unlocked ? `<button class="b p s" id="as"><i data-lucide="plus"></i> Add channel</button>` : ""}</div>
      ${toolbar}
      ${!o.socials.length
        ? `<div class="empty"><div class="e"><i data-lucide="share-2"></i></div><b>No social channels yet</b>
           ${unlocked ? "One per market — give each its country and language, and they cluster themselves."
                      : "Nothing added yet."}</div>`
        : !shown.length
          ? `<div class="empty"><div class="e"><i data-lucide="search-x"></i></div>
             <b>Nothing matches those filters</b>Loosen one of them, or press
             <b style="display:inline">Clear</b> to see all ${o.socials.length} again.</div>`
          : `<div class="gstack">${socGroups}</div>`}
    </div>`;

  icons(m); wireLogos(m);

  const sb = m.querySelector("#setupB"); if(sb) sb.onclick = setupModal;
  const rb = m.querySelector("#retryB");
  if(rb) rb.onclick = async () => {
    rb.disabled = true; rb.innerHTML = `<i data-lucide="loader"></i> Checking…`; icons(rb);
    if(!await tryReconnect()) toast("Still cannot reach the database", "cloud-off");
  };
  m.querySelector("#qr").onclick = () => qrModal(o);
  m.querySelector("#emb").onclick = () => embedModal(o);
  m.querySelector("#chk").onclick = () => checkLinks(o);
  m.querySelector("#cpall").onclick = () => copy(orgAsText(o), "All links copied");
  m.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copy(b.dataset.cp, "Link copied"));

  /* Grouping and filtering are read-only actions — they must work while the page is locked.
     A tier is only ever cleared downward: picking a region keeps the area it belongs to, but
     drops a language filter that region may not even speak. */
  m.querySelectorAll("[data-gb]").forEach(b => b.onclick = () => {
    groupMode = b.dataset.gb;
    try{ localStorage.setItem(GMKEY, groupMode); }catch(e){}
    render();
  });
  m.querySelectorAll("[data-cont]").forEach(b => b.onclick = () => {
    contFilter = b.dataset.cont === "*" ? null : b.dataset.cont;
    regFilter = langFilter = null;
    render();
  });
  m.querySelectorAll("[data-reg]").forEach(b => b.onclick = () => {
    const v = b.dataset.reg === "*" ? null : b.dataset.reg;
    /* the flag strip in the hero sits above the Area tier, so it sets that tier too rather
       than leaving a region selected that the visible area chips contradict */
    regFilter = (regFilter === v && b.classList.contains("rpill")) ? null : v;
    /* "" is a real choice — the channels with no region at all — and it belongs to no area,
       so it has to clear the area tier rather than be silently dropped by it */
    if(regFilter !== null) contFilter = continentOf(regFilter) || null;
    langFilter = null;
    render();
  });
  m.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
    langFilter = b.dataset.lang === "*" ? null : b.dataset.lang;
    render();
  });
  const cf = m.querySelector("#clrf");
  if(cf) cf.onclick = () => { contFilter = regFilter = langFilter = null; render(); };

  if(!unlocked) return;
  m.querySelector("#eo").onclick = () => orgForm(o.id);
  m.querySelector("#do").onclick = async () => {
    if(!await confirmBox("Delete organization?",
      `<b>${esc(o.name)}</b> plus its ${o.websites.length} website(s) and ${o.socials.length} channel(s) will be removed.`)) return;
    state.orgs = state.orgs.filter(x => x.id !== o.id);
    selected = state.orgs.length ? state.orgs[0].id : null;
    await commit("Organization deleted", "trash-2");
  };
  m.querySelector("#aw").onclick = () => siteForm(o.id);
  m.querySelector("#as").onclick = () => socialForm(o.id);
  m.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
    const p = b.dataset.ed.split(":");
    p[0] === "w" ? siteForm(o.id, p[1]) : socialForm(o.id, p[1]);
  });
  /* clicking the language pill opens the channel with that picker already focused */
  m.querySelectorAll("[data-edit-lang]").forEach(b => b.onclick =
    () => socialForm(o.id, b.dataset.editLang, '[data-cb="language"] .cbtn'));
  m.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    const p = b.dataset.rm.split(":");
    if(p[0] === "w"){
      const w = o.websites.find(x => x.id === p[1]);
      if(!await confirmBox("Remove website?", `<b>${esc(w.label || pretty(w.url))}</b> will be removed from ${esc(o.name)}.`)) return;
      o.websites = o.websites.filter(x => x.id !== p[1]);
      await commit("Website removed", "trash-2");
    }else{
      const x = o.socials.find(y => y.id === p[1]);
      if(!await confirmBox("Remove channel?", `The <b>${esc(platform(x.platform).name)}</b> channel will be removed from ${esc(o.name)}.`)) return;
      o.socials = o.socials.filter(y => y.id !== p[1]);
      await commit("Channel removed", "trash-2");
    }
  });
}

/* ═══════════════════ boot ═══════════════════ */
document.getElementById("q").oninput = e => { query = e.target.value; render(); };
document.getElementById("lock").onclick = lockUI;
document.getElementById("set").onclick = () => unlocked ? settingsModal() : lockUI();
document.getElementById("thm").onclick = async () => {
  state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = state.settings.theme;
  if(unlocked) await persist(); else writeLocal();
  render();
};
document.getElementById("sync").onclick = () => cloud.mode === "cloud" ? settingsModal2() : setupModal();
function settingsModal2(){ unlocked ? settingsModal() : toast("Cloud storage connected · shared across devices", "cloud"); }
document.addEventListener("click", e => { if(e.target.closest("#new")) unlocked ? orgForm() : lockUI(); });
addEventListener("hashchange", () => {
  const id = (location.hash || "").replace(/^#\/?/, "");
  if(id && org(id)){ selected = id; contFilter = regFilter = langFilter = null; render(); }
});

icons(document.body);

(async () => {
  /* The catalog loads alongside the directory but the first paint never waits on it. A cold
     CDN would otherwise hold the whole app on its skeleton for the sake of some country names —
     so paint with whatever is ready, and repaint once the catalog lands. Until then a region
     renders as its bare code ("VN"), which is still the truth, just less of it. */
  const geoReady = loadGeo().catch(e => { try{ geoFromIntl(); }catch(e2){} });

  /* A failed read has two very different meanings and used to have one outcome. If the server
     answered and only its database is down, this is an outage: keep the last copy we were given
     and say so. Falling back to browser storage there would show an empty page and invite
     somebody to type the whole directory back in. */
  const bootErr = await pullWithRetry(3);
  if(bootErr){
    if(bootErr.backend || readLastGood()) goOffline(bootErr);
    else { cloud.mode = "local"; state = readLocal(); }
  }

  unlocked = false;                                   // always start locked
  sessionStorage.setItem("orghub.unlocked", "0");

  const hashId = (location.hash || "").replace(/^#\/?/, "");
  selected = (hashId && org(hashId)) ? hashId
           : (state.orgs.length ? state.orgs.slice().sort((a, b) => a.name.localeCompare(b.name))[0].id : null);

  booting = false;
  render();                     // render() owns the entrance animation — do not animate again here
  autoCheck(org(selected));

  /* The repaint that turns "VN" into "Vietnam". It is silent: the entrance animation has
     already played, and replaying it here would make the page visibly stutter for anyone
     whose catalog happened to arrive a moment after their data did. */
  geoReady.then(() => { quiet = true; render(); quiet = false; });

  /* A paused Supabase comes back minutes after somebody restores it, and a laptop that was shut
     while offline wakes with a stale page. Neither should need a manual refresh, so poll gently
     while offline and check again the moment the tab is looked at or the network returns. */
  let recon = null;
  const recheck = async () => {
    if(cloud.mode !== "offline" || document.hidden) return;
    if(await tryReconnect() && recon){ clearInterval(recon); recon = null; }
  };
  recon = setInterval(recheck, 60e3);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) recheck(); });
  addEventListener("online", recheck);
})();
})();
</script>
