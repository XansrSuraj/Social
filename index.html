<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko — official websites & social channels</title>
<meta name="description" content="The internal directory of every official website and social media channel, always up to date.">
<meta name="theme-color" content="#5b6bff">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Aiko">
<meta property="og:description" content="Every official website and social channel in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b6bff'/%3E%3Cpath d='M9 21l7-13 7 13z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@13/font/simple-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* ═══════════════ tokens ═══════════════ */
:root{
  --a1:#5b6bff; --a2:#a855f7;
  --bg:#f7f8fb; --bg-tint:#eef0f8;
  --surf:#ffffff; --surf2:#f6f7fb; --surf3:#eef0f6;
  --glass:rgba(255,255,255,.75);
  --tx:#0b0e18; --tx2:#5a6280; --tx3:#9aa1bb;
  --ln:#e7e9f2; --ln2:#f0f1f7;
  --red:#e0342c; --amb:#d97706; --grn:#0f9d58;
  --s1:0 1px 2px rgba(12,17,40,.05);
  --s2:0 1px 3px rgba(12,17,40,.05),0 10px 26px -14px rgba(12,17,40,.2);
  --s3:0 2px 8px rgba(12,17,40,.06),0 26px 60px -24px rgba(12,17,40,.3);
  --s4:0 40px 90px -30px rgba(12,17,40,.45);
  --rl:20px; --rm:14px; --rs:10px;
}
html[data-theme="dark"]{
  --bg:#070810; --bg-tint:#0c0e18;
  --surf:#101320; --surf2:#161a2a; --surf3:#1d2234;
  --glass:rgba(14,17,28,.78);
  --tx:#f0f2fa; --tx2:#98a0bd; --tx3:#69708c;
  --ln:#212639; --ln2:#191d2c;
  --red:#ff6b63; --amb:#fbbf24; --grn:#3ddc84;
  --s1:0 1px 2px rgba(0,0,0,.35);
  --s2:0 1px 3px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.75);
  --s3:0 2px 10px rgba(0,0,0,.35),0 30px 70px -28px rgba(0,0,0,.9);
  --s4:0 40px 100px -30px rgba(0,0,0,1);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
  font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv02","cv03","cv04","tnum";
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--a1) 28%,transparent)}
.gt{background:linear-gradient(100deg,var(--a1),var(--a2) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ambient light */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.28}
html[data-theme="dark"] .aura i{opacity:.2}
.aura i:nth-child(1){width:44vw;height:44vw;background:var(--a1);top:-16vw;left:-10vw;animation:dr1 24s ease-in-out infinite}
.aura i:nth-child(2){width:36vw;height:36vw;background:var(--a2);top:4vw;right:-12vw;animation:dr2 28s ease-in-out infinite}
@keyframes dr1{50%{transform:translate(5vw,6vw) scale(1.15)}}
@keyframes dr2{50%{transform:translate(-6vw,8vw) scale(.9)}}
@media(prefers-reduced-motion:reduce){.aura i{animation:none}}

/* ═══════════════ buttons ═══════════════ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;
  border-radius:11px;font-weight:600;font-size:13.5px;letter-spacing:-.1px;white-space:nowrap;
  background:var(--surf2);border:1px solid var(--ln);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.35),box-shadow .18s,background .18s,border-color .18s,color .18s}
.b:hover{transform:translateY(-1.5px);box-shadow:var(--s1);border-color:color-mix(in srgb,var(--a1) 42%,var(--ln))}
.b:active{transform:translateY(0) scale(.97)}
.b.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px -9px color-mix(in srgb,var(--a1) 90%,transparent)}
.b.p:hover{box-shadow:0 14px 32px -11px color-mix(in srgb,var(--a1) 95%,transparent)}
.b.g{background:none;border-color:transparent;color:var(--tx2)}
.b.g:hover{background:var(--surf2);color:var(--tx);border-color:var(--ln)}
.b.d{color:var(--red)}
.b.d:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.b.s{padding:6px 11px;font-size:12.5px;border-radius:9px;gap:5px}
.b.i{padding:0;width:32px;height:32px;border-radius:9px;flex:none}
.b.i.s{width:28px;height:28px;border-radius:8px}
.b.xl{padding:13px 22px;font-size:15px;border-radius:13px}
.b[disabled]{opacity:.4;pointer-events:none}
.b svg{width:15px;height:15px;flex:none}
.b.xl svg{width:17px;height:17px}
.b.i.s svg{width:13px;height:13px}

/* ═══════════════ topbar ═══════════════ */
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:11px;padding:11px 20px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.7);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16.5px;letter-spacing:-.4px}
.brand .m{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 5px 16px -6px color-mix(in srgb,var(--a1) 90%,transparent)}
.brand .m svg{width:16px;height:16px}
.sp{flex:1}
.sbox{display:flex;align-items:center;gap:9px;background:var(--surf2);border:1px solid var(--ln);
  border-radius:999px;padding:8px 14px;min-width:210px;transition:.2s}
.sbox:focus-within{border-color:var(--a1);background:var(--surf);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
.sbox input{background:none;border:0;outline:none;width:100%;min-width:0;font-size:14px}
.sbox svg{width:15px;height:15px;color:var(--tx3);flex:none}
.kb{font:600 10.5px/1 ui-monospace,monospace;color:var(--tx3);border:1px solid var(--ln);border-radius:5px;padding:3px 5px;background:var(--surf);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:6px 11px;
  border-radius:999px;border:1px solid var(--ln);background:var(--surf2);color:var(--tx2)}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.sync.on .d{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 22%,transparent)}
.sync.warn{color:var(--amb);border-color:color-mix(in srgb,var(--amb) 40%,transparent)}
.sync.warn .d{background:var(--amb)}
.sync.busy .d{background:var(--a1);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ═══════════════ layout ═══════════════ */
.shell{display:grid;grid-template-columns:262px 1fr;gap:20px;max-width:1460px;margin:0 auto;padding:20px;align-items:start}
.card{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rl);box-shadow:var(--s2)}
aside{position:sticky;top:82px}
.rail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 15px;border-bottom:1px solid var(--ln2)}
.rail-h h2{margin:0;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:750}
.rail{max-height:calc(100vh - 240px);overflow:auto;padding:9px}
.rail::-webkit-scrollbar{width:7px}.rail::-webkit-scrollbar-thumb{background:var(--ln);border-radius:8px}
.oi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;
  border:1px solid transparent;margin-bottom:2px;transition:.16s;position:relative}
.oi:hover{background:var(--surf2)}
.oi.on{background:color-mix(in srgb,var(--a1) 10%,transparent);border-color:color-mix(in srgb,var(--a1) 26%,transparent)}
.oi.on::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:20px;
  border-radius:0 3px 3px 0;background:linear-gradient(var(--a1),var(--a2))}
.oi .nm{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.oi .sb{font-size:11.5px;color:var(--tx2);display:block}

/* logo blocks */
.lg{width:36px;height:36px;border-radius:11px;flex:none;position:relative;overflow:hidden;box-shadow:var(--s1);
  display:grid;place-items:center;background:var(--surf3)}
.lg img{width:100%;height:100%;object-fit:cover;display:block}
.lg .fb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:750;font-size:13px;letter-spacing:-.4px}
.lg.xl{width:64px;height:64px;border-radius:18px}
.lg.xl .fb{font-size:23px}
.lg.sm{width:30px;height:30px;border-radius:9px}
.lg.sm .fb{font-size:11px}

/* ═══════════════ detail ═══════════════ */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{padding:22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2),transparent)}
.hero-top{display:flex;gap:16px;align-items:flex-start}
.hero h1{margin:0 0 5px;font-size:26px;letter-spacing:-.9px;font-weight:780;line-height:1.15}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--ln);color:var(--tx2)}
.notes{margin:11px 0 0;color:var(--tx2);font-size:13.5px;white-space:pre-wrap;max-width:72ch}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--ln2)}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.m{background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);padding:14px 16px;box-shadow:var(--s1)}
.m b{display:block;font-size:24px;font-weight:750;letter-spacing:-1px;line-height:1.1}
.m span{font-size:11.5px;color:var(--tx2);font-weight:650;letter-spacing:.02em}
.m .hl{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:650}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:0 2px}
.sec-h h3{margin:0;font-size:15px;display:flex;align-items:center;gap:9px;letter-spacing:-.3px;font-weight:720}
.sec-h h3 svg{width:16px;height:16px;color:var(--a1)}
.ct{font-size:11.5px;font-weight:750;color:var(--tx2);background:var(--surf2);border:1px solid var(--ln);padding:1px 8px;border-radius:999px}

/* tile grid — the main visual upgrade */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.t{--c:var(--a1);position:relative;background:var(--surf);border:1px solid var(--ln);border-radius:var(--rm);
  padding:14px;box-shadow:var(--s1);overflow:hidden;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .22s,border-color .2s}
.t::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);opacity:.9}
.t::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:.22s;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 13%,transparent),transparent 70%)}
.t:hover{transform:translateY(-3px);box-shadow:var(--s3);border-color:color-mix(in srgb,var(--c) 40%,var(--ln))}
.t:hover::after{opacity:1}
.t .r1{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.t .nm{display:block;font-weight:680;font-size:14px;letter-spacing:-.2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .hd{display:block;font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .lk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--ln2);transition:.16s}
.t .lk:hover{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.t .lk svg{width:12px;height:12px;flex:none;opacity:.7}
.t .tb{display:flex;gap:3px;justify-content:flex-end;margin-top:9px;opacity:0;transform:translateY(4px);transition:.2s}
.t:hover .tb,.t:focus-within .tb{opacity:1;transform:none}
@media(hover:none){.t .tb{opacity:1;transform:none}}
.chip{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;
  font-weight:800;font-size:11.5px;box-shadow:var(--s1);border:1px solid rgba(255,255,255,.16);background:var(--c)}
.chip i.si{font-size:16px;line-height:1}
.chip svg{width:17px;height:17px}
.chip .ini{display:block}
body.si-ok .chip .ini{display:none}
body:not(.si-ok) .chip i.si{display:none}
.hd-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto;background:var(--tx3);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--tx3) 18%,transparent);cursor:help}
.hd-dot.ok{background:var(--grn);box-shadow:0 0 0 3px color-mix(in srgb,var(--grn) 20%,transparent)}
.hd-dot.warn{background:var(--amb);box-shadow:0 0 0 3px color-mix(in srgb,var(--amb) 20%,transparent)}
.hd-dot.bad{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent)}
.hd-dot.spin{background:var(--a1);animation:pulse .9s ease-in-out infinite}

.empty{padding:38px 20px;text-align:center;color:var(--tx2);font-size:13.5px;
  border:1.5px dashed var(--ln);border-radius:var(--rm);background:var(--surf2)}
.empty b{display:block;color:var(--tx);margin-bottom:5px;font-size:15px;font-weight:700}
.empty .e{width:44px;height:44px;border-radius:13px;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--surf);border:1px solid var(--ln);color:var(--tx3)}
.empty .e svg{width:20px;height:20px}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-radius:var(--rm);font-size:13.5px;line-height:1.55;
  background:color-mix(in srgb,var(--a1) 8%,transparent);border:1px solid color-mix(in srgb,var(--a1) 24%,transparent)}
.note.warn{background:color-mix(in srgb,var(--amb) 10%,transparent);border-color:color-mix(in srgb,var(--amb) 34%,transparent)}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--a1)}
.note.warn svg{color:var(--amb)}
.note .b{margin-left:auto;flex:none}

footer{border-top:1px solid var(--ln);padding:24px 20px 36px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.9}

/* ═══════════════ modal ═══════════════ */
.veil{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:18px;
  background:rgba(5,7,15,.62);backdrop-filter:blur(6px)}
.veil.on{display:grid}
.mo{background:var(--surf);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--s4);
  width:100%;max-width:490px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mo.w{max-width:660px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px;border-bottom:1px solid var(--ln2)}
.mh h3{margin:0;font-size:17px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px;font-weight:730}
.mh h3 svg{width:18px;height:18px;color:var(--a1)}
.mb{padding:19px;overflow:auto}
.mf{display:flex;gap:9px;justify-content:flex-end;padding:15px 19px;border-top:1px solid var(--ln2);background:var(--surf2)}
.f{margin-bottom:15px}.f:last-child{margin-bottom:0}
.f label{display:block;font-size:11.5px;font-weight:750;margin-bottom:7px;color:var(--tx2);letter-spacing:.05em;text-transform:uppercase}
.f input[type=text],.f input[type=password],.f select,.f textarea{width:100%;padding:11px 13px;border:1px solid var(--ln);
  border-radius:11px;background:var(--surf2);outline:none;transition:.18s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--a1);background:var(--surf);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 13%,transparent)}
.f textarea{resize:vertical;min-height:70px}
.hint{font-size:12px;color:var(--tx3);margin-top:7px;line-height:1.55}
.err{color:var(--red);font-size:13px;font-weight:650;margin-top:12px;display:none;padding:9px 12px;
  border-radius:10px;background:color-mix(in srgb,var(--red) 10%,transparent)}
.err.on{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dv{height:1px;background:var(--ln2);margin:19px 0}
.sr{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:10px 0}
.sr .t1{font-weight:660;font-size:14px}
.sr .d1{font-size:12.5px;color:var(--tx2)}
.pr{display:flex;align-items:center;gap:10px;padding:7px;border-radius:10px;transition:.15s}
.pr:hover{background:var(--surf2)}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:9px;border:2.5px solid transparent;cursor:pointer;transition:.16s}
.sw:hover,.sw.on{transform:scale(1.12)}
.sw.on{border-color:var(--tx)}
.seg{display:flex;gap:3px;background:var(--surf2);border:1px solid var(--ln);border-radius:11px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:660;color:var(--tx2);transition:.16s}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:var(--s1)}
pre.code{margin:0;padding:13px 15px;border-radius:12px;background:var(--surf3);border:1px solid var(--ln);
  font:500 12px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre;color:var(--tx)}
#qrbox{display:grid;place-items:center;padding:18px;background:#fff;border-radius:16px;border:1px solid var(--ln)}
#qrbox canvas,#qrbox img{display:block}

#toast{position:fixed;bottom:24px;left:50%;z-index:220;display:flex;align-items:center;gap:9px;padding:12px 18px;
  border-radius:13px;font-weight:650;font-size:13.5px;pointer-events:none;background:var(--tx);color:var(--bg);
  box-shadow:var(--s4);opacity:0;transform:translateX(-50%) translateY(22px);max-width:min(90vw,460px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);transition:.26s cubic-bezier(.2,.9,.3,1.2)}
#toast svg{width:15px;height:15px;flex:none}

.sk{background:linear-gradient(90deg,var(--surf2),var(--surf3),var(--surf2));background-size:200% 100%;
  animation:sh 1.3s linear infinite;border-radius:var(--rm);height:96px}
@keyframes sh{to{background-position:-200% 0}}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;padding:14px;gap:14px}
  aside{position:static}
  .rail{max-height:270px}
  header{padding:10px 14px}
  .sbox{order:9;width:100%;min-width:0}
  .kb{display:none}
  .hero{padding:18px}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
</style>
</head>
<body>

<div class="aura"><i></i><i></i></div>

<header>
  <div class="brand"><span class="m"><i data-lucide="radio-tower"></i></span><span id="ttl">Aiko</span></div>
  <div class="sbox">
    <i data-lucide="search"></i>
    <input id="q" type="text" placeholder="Search organizations, sites, channels…" autocomplete="off">
    <span class="kb">/</span>

<script>
(() => {
"use strict";

/* ═══════════════════ optional libs (never fatal) ═══════════════════ */
const G = () => window.gsap;
const reduce = () => matchMedia("(prefers-reduced-motion:reduce)").matches;

function icons(root){
  const l = window.lucide;
  if(l && l.createIcons){ try{ l.createIcons({ root: root || document.body, attrs:{ "stroke-width":2 } }); return; }catch(e){} }
  (root || document).querySelectorAll("[data-lucide]").forEach(el => {
    if(el.dataset.fbd) return;
    el.dataset.fbd = "1";
    const host = el.closest("[data-fb]");
    if(host){ host.textContent = host.dataset.fb; } else { el.remove(); }
  });
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    try{ if(document.fonts.check('1em "simple-icons"')) document.body.classList.add("si-ok"); }catch(e){}
  });
}
/* Entrance animation.
   Uses fromTo() with an explicit end state — never from(). A bare from() records
   its end value at creation time, so calling it twice on the same element makes the
   second tween animate 0 -> 0 and the content stays invisible for good.
   clearProps also strips the inline styles afterwards, so nothing can be left stranded. */
function anim(t, from){
  const g = G();
  if(!t || !g || reduce()) return;
  try{
    const els = typeof t === "string" ? document.querySelectorAll(t) : t;
    if(!els || (els.length === 0 && !els.nodeType)) return;
    g.killTweensOf(els);
    g.set(els, { clearProps:"opacity,transform" });
    const start = Object.assign({}, from);
    const end = { opacity:1, x:0, y:0, scale:1, duration:.4, ease:"power3.out",
                  overwrite:"auto", clearProps:"opacity,transform" };
    ["duration","ease","stagger","delay"].forEach(k => {
      if(start[k] !== undefined){ end[k] = start[k]; delete start[k]; }
    });
    g.fromTo(els, start, end);
    // Safety net: visibility must never depend on the animation finishing.
    // A backgrounded tab pauses requestAnimationFrame, which would otherwise leave
    // content stuck at opacity 0. Stripping the inline styles reveals it regardless.
    setTimeout(() => { try{ g.set(els, { clearProps:"opacity,transform" }); }catch(e){} }, 1600);
  }catch(e){}
}

/* ═══════════════════ constants ═══════════════════ */
const DEF_PLATFORMS = [
  { id:"facebook",  name:"Facebook",        color:"#1877f2", icon:"si:facebook" },
  { id:"instagram", name:"Instagram",       color:"#e1306c", icon:"si:instagram" },
  { id:"x",         name:"X (Twitter)",     color:"#16181c", icon:"si:x" },
  { id:"linkedin",  name:"LinkedIn",        color:"#0a66c2", icon:"si:linkedin" },
  { id:"youtube",   name:"YouTube",         color:"#ff0033", icon:"si:youtube" },
  { id:"tiktok",    name:"TikTok",          color:"#00b8c4", icon:"si:tiktok" },
  { id:"threads",   name:"Threads",         color:"#3d3d3d", icon:"si:threads" },
  { id:"pinterest", name:"Pinterest",       color:"#bd081c", icon:"si:pinterest" },
  { id:"whatsapp",  name:"WhatsApp",        color:"#25d366", icon:"si:whatsapp" },
  { id:"telegram",  name:"Telegram",        color:"#229ed9", icon:"si:telegram" },
  { id:"snapchat",  name:"Snapchat",        color:"#c9a800", icon:"si:snapchat" },
  { id:"reddit",    name:"Reddit",          color:"#ff4500", icon:"si:reddit" },
  { id:"discord",   name:"Discord",         color:"#5865f2", icon:"si:discord" },
  { id:"spotify",   name:"Spotify",         color:"#1db954", icon:"si:spotify" },
  { id:"gbp",       name:"Google Business", color:"#34a853", icon:"lucide:store" },
  { id:"other",     name:"Other channel",  color:"#64748b", icon:"lucide:at-sign" },
];
const THEMES = [
  { a1:"#5b6bff", a2:"#a855f7" }, { a1:"#0ea5e9", a2:"#22d3ee" }, { a1:"#10b981", a2:"#84cc16" },
  { a1:"#f43f5e", a2:"#f97316" }, { a1:"#f59e0b", a2:"#eab308" }, { a1:"#8b5cf6", a2:"#ec4899" },
  { a1:"#334155", a2:"#64748b" },
];
const LKEY = "orghub.v1", HKEY = "orghub.health", HTTL = 3600e3;

const blank = () => ({
  settings:{ title:"Aiko", a1:"#5b6bff", a2:"#a855f7", theme:"dark", passHash:null,
             platforms:DEF_PLATFORMS.map(p => ({ ...p })) },
  orgs:[]
});
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

/* ═══════════════════ state ═══════════════════ */
let state = blank();
let cloud = { mode:"local", configured:false, adminReady:false, updatedAt:null, saving:false, error:null };
let unlocked = false, selected = null, query = "", booting = true;
let health = {};                                        // url -> {ok,status,note,at}
let checking = new Set();

function normalize(d){
  const b = blank();
  const st = { settings:{ ...b.settings, ...((d && d.settings) || {}) },
               orgs:(d && Array.isArray(d.orgs)) ? d.orgs : [] };
  if(d && d.settings && d.settings.accent && !d.settings.a1){ st.settings.a1 = d.settings.accent; st.settings.a2 = d.settings.accent; }
  /* one-time rename: saved settings from earlier versions still carry the old title */
  if(["Org Hub", "Aiko Org Hub"].indexOf(st.settings.title) !== -1) st.settings.title = "Aiko";
  st.settings.platforms = (st.settings.platforms || []).map(p => {
    const def = DEF_PLATFORMS.find(x => x.id === p.id);
    return { ...p, icon:p.icon || (def ? def.icon : "") };
  });
  if(!st.settings.platforms.length) st.settings.platforms = b.settings.platforms;
  st.orgs.forEach(o => { o.websites = o.websites || []; o.socials = o.socials || []; o.tags = o.tags || []; });
  return st;
}
const readLocal  = () => { try{ return normalize(JSON.parse(localStorage.getItem(LKEY) || "null")); }catch(e){ return blank(); } };
const writeLocal = () => { try{ localStorage.setItem(LKEY, JSON.stringify(state)); }catch(e){} };
const adminKey   = () => sessionStorage.getItem("orghub.key") || "";

try{ const h = JSON.parse(localStorage.getItem(HKEY) || "{}"); if(h && typeof h === "object") health = h; }catch(e){}
const saveHealth = () => { try{ localStorage.setItem(HKEY, JSON.stringify(health)); }catch(e){} };

/* ═══════════════════ cloud layer ═══════════════════ */
async function pull(){
  const r = await fetch("api/data", { cache:"no-store" });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "read failed");
  cloud.configured = !!j.configured;
  cloud.adminReady = !!j.adminReady;
  if(j.configured){
    cloud.mode = "cloud"; cloud.updatedAt = j.updatedAt || null;
    state = normalize(j.data);
  }else{
    cloud.mode = "local"; state = readLocal();
  }
}

/* GET /api/data is public, so the row must never carry the local password hash —
   an exposed hash of a reused password is brute-forceable offline. In cloud mode the
   password lives only in the ADMIN_PASSWORD env var, so the hash is dead weight anyway. */
function cloudPayload(){
  const copy = { ...state, settings:{ ...state.settings } };
  delete copy.settings.passHash;
  return copy;
}

async function persist(){
  if(cloud.mode !== "cloud"){ writeLocal(); return true; }
  cloud.saving = true; cloud.error = null; paintSync();
  try{
    const r = await fetch("api/data", {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "x-admin-key":adminKey() },
      body:JSON.stringify({ data:cloudPayload(), baseUpdatedAt:cloud.updatedAt })
    });
    const j = await r.json().catch(() => ({}));
    if(r.status === 409){
      cloud.saving = false; paintSync();
      const go = await confirmBox("Changed on another device",
        "Someone saved a newer version of this data. Reload to get the latest — your unsaved change here will be lost.", false);
      if(go){ await pull(); render(); }
      return false;
    }
    if(r.status === 401){
      cloud.saving = false; setUnlocked(false);
      toast("Session expired — sign in again", "lock"); return false;
    }
    if(!r.ok || !j.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
    cloud.updatedAt = j.updatedAt || cloud.updatedAt;
    cloud.saving = false; paintSync();
    return true;
  }catch(e){
    cloud.saving = false; cloud.error = String(e.message || e); paintSync();
    toast("Could not save: " + cloud.error, "triangle-alert");
    return false;
  }
}
/* every mutation goes through this */
async function commit(msg, ic){
  const ok = await persist();
  render();
  if(ok && msg) toast(msg, ic || "check");
  return ok;
}

/* ═══════════════════ helpers ═══════════════════ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const org = id => state.orgs.find(o => o.id === id);

function safeUrl(u){
  const s = String(u || "").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";
  return "https://" + s.replace(/^\/+/, "");
}
function hostOf(u){ try{ return new URL(safeUrl(u)).hostname; }catch(e){ return ""; } }
function pretty(u){
  try{ const x = new URL(safeUrl(u)); return (x.host.replace(/^www\./, "") + x.pathname).replace(/\/$/, ""); }
  catch(e){ return String(u || ""); }
}
/* logo auto-fetch — favicon straight from the domain, no API key */
function favicon(u, sz){
  const h = hostOf(u);
  return h ? "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(h) + "&sz=" + (sz || 64) : "";
}
const platform = id => state.settings.platforms.find(p => p.id === id) ||
  { id:"other", name:"Other channel", color:"#64748b", icon:"lucide:at-sign" };

function initials(n){
  const p = String(n || "?").trim().split(/\s+/).filter(Boolean);
  return (((p[0] || "?")[0]) + ((p[1] || "")[0] || "")).toUpperCase();
}
function hue(n){ let h = 0; const s = String(n || ""); for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
const grad = n => `linear-gradient(135deg,hsl(${hue(n)} 64% 54%),hsl(${(hue(n) + 44) % 360} 68% 44%))`;

function iconOf(spec, fallback){
  const s = String(spec || "");
  if(s.startsWith("si:"))     return `<span class="ini">${esc(fallback)}</span><i class="si si-${esc(s.slice(3))}"></i>`;
  if(s.startsWith("lucide:")) return `<i data-lucide="${esc(s.slice(7))}"></i>`;
  return `<span class="ini" style="display:block">${esc(fallback)}</span>`;
}
/* org logo: manual override → favicon of its first website → gradient initials */
function logoBox(o, cls){
  const src = o.logo ? safeUrl(o.logo) : (o.websites[0] ? favicon(o.websites[0].url, 128) : "");
  const fb = `<span class="fb" style="background:${grad(o.name)}">${esc(initials(o.name))}</span>`;
  return `<span class="lg ${cls || ""}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ""}${fb}</span>`;
}
async function sha(t){
  try{
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("orghub$" + t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }catch(e){
    let h = 0x811c9dc5, s = "orghub$" + t;
    for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return "fb" + h.toString(16);
  }
}
let tT;
function toast(msg, ic){
  const t = document.getElementById("toast");
  t.innerHTML = `<i data-lucide="${esc(ic || "check")}"></i><span>${esc(msg)}</span>`;
  icons(t); t.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2600);
}
function copy(txt, msg){
  const done = () => toast(msg || "Copied", "copy");
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(done, fb);
  fb();
  function fb(){
    const a = document.createElement("textarea");
    a.value = txt; a.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copy failed", "triangle-alert"); }
    a.remove();
  }
}
const wireLogos = root => root.querySelectorAll(".lg img").forEach(img => {
  img.addEventListener("error", () => { img.style.display = "none"; }, { once:true });
  img.addEventListener("load", () => {
    // favicon services return a 16px placeholder for unknown domains — keep the initials then
    if(img.naturalWidth && img.naturalWidth <= 16) img.style.display = "none";
    else { const fb = img.parentNode.querySelector(".fb"); if(fb) fb.style.display = "none"; }
  }, { once:true });
});

/* ═══════════════════ modal ═══════════════════ */
const veil = document.getElementById("veil"), mo = document.getElementById("mo");
let onEsc = null, onVeil = null;

function openModal(html, opt){
  opt = opt || {};
  mo.className = "mo" + (opt.wide ? " w" : "");
  mo.innerHTML = html;
  veil.classList.add("on");
  icons(mo); wireLogos(mo);
  anim(mo, { y:14, scale:.975, opacity:0, duration:.32, ease:"back.out(1.5)" });
  mo.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  const form = mo.querySelector("form");
  if(form && opt.onSubmit) form.onsubmit = e => { e.preventDefault(); opt.onSubmit(form); };
  const sel = opt.focus === null ? null : (opt.focus || "input,select,textarea");
  const f = sel && mo.querySelector(sel);
  if(f) setTimeout(() => f.focus(), 60);
  onEsc = onVeil = closeModal;
}
function closeModal(){ veil.classList.remove("on"); mo.innerHTML = ""; onEsc = onVeil = null; }
veil.onclick = e => { if(e.target === veil && onVeil) onVeil(); };
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && onEsc) return onEsc();
  if(e.key === "/" && !veil.classList.contains("on") && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); const q = document.getElementById("q"); if(q) q.focus();
  }
});
const X = `<button class="b g i" data-close data-fb="X"><i data-lucide="x"></i></button>`;
function showErr(m){
  let el = mo.querySelector(".err");
  if(!el){ el = document.createElement("div"); el.className = "err"; mo.querySelector(".mb").appendChild(el); }
  el.textContent = m; el.classList.add("on"); anim(el, { y:-4, opacity:0, duration:.22 });
}
function confirmBox(title, body, danger){
  danger = danger !== false;
  return new Promise(res => {
    openModal(`
      <div class="mh"><h3><i data-lucide="${danger ? "triangle-alert" : "circle-help"}"></i>${esc(title)}</h3>${X}</div>
      <div class="mb"><div style="color:var(--tx2);line-height:1.6">${body}</div></div>
      <div class="mf"><button class="b" data-close>Cancel</button>
        <button class="b ${danger ? "d" : "p"}" id="y">${danger ? "Yes, delete" : "Continue"}</button></div>`,
      { focus:"#y" });
    mo.querySelector("#y").onclick = () => { closeModal(); res(true); };
    onEsc = onVeil = () => { closeModal(); res(false); };
  });
}

/* ═══════════════════ admin ═══════════════════ */
function setUnlocked(v){
  unlocked = v;
  if(!v) sessionStorage.removeItem("orghub.key");
  sessionStorage.setItem("orghub.unlocked", v ? "1" : "0");
  render();
}
function lockUI(){
  if(unlocked){ setUnlocked(false); toast("Locked — the page is read-only now", "lock"); return; }
  if(cloud.mode === "cloud" && !cloud.adminReady){
    return openModal(`
      <div class="mh"><h3><i data-lucide="triangle-alert"></i>Admin password not set</h3>${X}</div>
      <div class="mb"><div class="note warn"><i data-lucide="info"></i><span>Cloud storage is connected, but no
        <b>ADMIN_PASSWORD</b> environment variable exists on this deployment — so editing is disabled for everybody.
        Add it in Vercel → Project → Settings → Environment Variables, then redeploy.</span></div></div>
      <div class="mf"><button class="b p" data-close>Got it</button></div>`, { focus:null });
  }
  if(cloud.mode === "local" && !state.settings.passHash) return passwordModal(true);

  openModal(`
    <div class="mh"><h3><i data-lucide="shield-check"></i>Admin sign in</h3>${X}</div>
    <form><div class="mb">
      <div class="f"><label>Admin password</label>
        <input type="password" name="p" placeholder="Enter password" autocomplete="current-password">
        <div class="hint">${cloud.mode === "cloud"
          ? "Verified on the server. Without it this page is strictly read-only for everyone."
          : "Stored only in this browser. Without it the page is read-only."}</div></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p"><i data-lucide="lock-open"></i> Unlock</button></div></form>`, {
    onSubmit: async f => {
      const pw = f.p.value;
      if(cloud.mode === "cloud"){
        try{
          const r = await fetch("api/auth", { method:"POST", headers:{ "Content-Type":"application/json" },
                                              body:JSON.stringify({ password:pw }) });
          const j = await r.json().catch(() => ({}));
          if(!r.ok || !j.ok) return showErr(j.error || "Wrong password.");
          sessionStorage.setItem("orghub.key", pw);
        }catch(e){ return showErr("Could not reach the server. Check your connection."); }
      }else{
        if(await sha(pw) !== state.settings.passHash) return showErr("Wrong password.");
      }
      closeModal(); setUnlocked(true); toast("Admin unlocked", "lock-open");
    }
  });
}
function passwordModal(first){
  if(cloud.mode === "cloud"){
    return openModal(`
      <div class="mh"><h3><i data-lucide="key-round"></i>Admin password</h3>${X}</div>
      <div class="mb"><div class="note"><i data-lucide="info"></i><span>In cloud mode the password lives on the
        server as the <b>ADMIN_PASSWORD</b> environment variable — it is never stored in the browser.
        To change it: Vercel → Project → Settings → Environment Variables → edit <b>ADMIN_PASSWORD</b> → Redeploy.</span></div></div>
      <div class="mf"><button class="b p" data-close>Got it</button></div>`, { focus:null });
  }
  const has = !!state.settings.passHash;
  openModal(`
    <div class="mh"><h3><i data-lucide="key-round"></i>${first ? "Create admin password" : "Change password"}</h3>${X}</div>
    <form><div class="mb">
      ${first ? `<div class="note" style="margin-bottom:16px"><i data-lucide="info"></i><span>Saved in this browser
        as a one-way hash. Write it down — it cannot be recovered.</span></div>` : ""}
      ${has ? `<div class="f"><label>Current password</label><input type="password" name="old"></div>` : ""}
      <div class="f"><label>New password</label><input type="password" name="a"></div>
      <div class="f"><label>Repeat password</label><input type="password" name="b"></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p">Save password</button></div></form>`, {
    onSubmit: async f => {
      if(has && await sha(f.old.value) !== state.settings.passHash) return showErr("Current password is wrong.");
      if(f.a.value.length < 4) return showErr("Use at least 4 characters.");
      if(f.a.value !== f.b.value) return showErr("The passwords don't match.");
      state.settings.passHash = await sha(f.a.value);
      writeLocal(); closeModal(); setUnlocked(true);
      toast(first ? "Password set — you're signed in" : "Password updated", "shield-check");
    }
  });
}

/* ═══════════════════ forms ═══════════════════ */
function orgForm(id){
  const o = id ? org(id) : null;
  openModal(`
    <div class="mh"><h3><i data-lucide="building-2"></i>${o ? "Edit organization" : "New organization"}</h3>${X}</div>
    <form><div class="mb">
      <div class="f"><label>Name *</label>
        <input type="text" name="name" value="${esc(o ? o.name : "")}" placeholder="Aiko Media"></div>
      <div class="f"><label>Logo URL <span style="font-weight:400;text-transform:none">— optional</span></label>
        <input type="text" name="logo" value="${esc(o ? o.logo || "" : "")}" placeholder="Leave empty to auto-fetch from the website">
        <div class="hint">Empty = the logo is pulled automatically from the first website's domain.</div></div>
      <div class="f"><label>Tags</label>
        <input type="text" name="tags" value="${esc(o ? o.tags.join(", ") : "")}" placeholder="brand, india, priority"></div>

        <textarea name="notes" placeholder="Anything the team should know…">${esc(o ? o.notes || "" : "")}</textarea></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p">${o ? "Save changes" : "Add organization"}</button></div></form>`, {
    onSubmit: async f => {
      const name = f.name.value.trim();

                  notes:f.notes.value.trim() };
      if(o) Object.assign(o, d);
      else { const n = { id:uid(), websites:[], socials:[], ...d }; state.orgs.push(n); selected = n.id; }
      closeModal();
      await commit(o ? "Organization updated" : name + " added", "building-2");
    }
  });
}
function siteForm(oid, sid){
  const o = org(oid), s = sid ? o.websites.find(w => w.id === sid) : null;
  openModal(`
    <div class="mh"><h3><i data-lucide="globe"></i>${s ? "Edit website" : "Add website"}</h3>${X}</div>
    <form><div class="mb">
      <div class="f"><label>Label</label>
        <input type="text" name="label" value="${esc(s ? s.label : "")}" placeholder="Main site / Blog / Careers"></div>
      <div class="f"><label>URL *</label>
        <input type="text" name="url" value="${esc(s ? s.url : "")}" placeholder="aiko.com">
        <div class="hint">https:// is added automatically. Add as many websites as you need.</div></div>
    </div>
    <div class="mf"><button type="button" class="b" data-close>Cancel</button>
      <button class="b p">${s ? "Save" : "Add website"}</button></div></form>`, {
    onSubmit: async f => {
      const url = safeUrl(f.url.value);

/* ═══════════════════ link health checker ═══════════════════ */
const hkey = u => safeUrl(u);
function hstate(u){
  const h = health[hkey(u)];
  if(!h) return { cls:"", txt:"Not checked yet" };
  const age = Date.now() - (h.at || 0);
  const when = age < 60e3 ? "just now" : age < 3600e3 ? Math.round(age / 60e3) + "m ago" : Math.round(age / 3600e3) + "h ago";
  if(h.ok)          return { cls:"ok",   txt:`Live · HTTP ${h.status} · ${h.ms}ms · checked ${when}` };
  if(h.status === 403 || h.status === 0 && h.note === "Blocked") return { cls:"warn", txt:`${h.note} · checked ${when}` };
  return { cls:"bad", txt:`${h.note || "HTTP " + h.status} · checked ${when}` };
}
function allUrls(o){
  return [...o.websites.map(w => safeUrl(w.url)), ...o.socials.map(s => safeUrl(s.url))].filter(Boolean);
}
async function checkLinks(o, only){
  if(!location.protocol.startsWith("http")){
    if(!only) toast("Link checking needs the deployed site (it runs on the server)", "info");
    return;
  }
  const urls = (only || allUrls(o)).filter(Boolean);
  if(!urls.length) return;
  urls.forEach(u => checking.add(u));
  paintDots();
  try{
    const r = await fetch("api/check", { method:"POST", headers:{ "Content-Type":"application/json" },
                                         body:JSON.stringify({ urls }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "check failed");
    j.results.forEach(x => { health[hkey(x.url)] = { ok:x.ok, status:x.status, ms:x.ms, note:x.note, at:Date.now() }; });
    saveHealth();
    const bad = j.results.filter(x => !x.ok).length;
    if(!only) toast(bad ? `${bad} of ${j.results.length} link(s) need attention` : `All ${j.results.length} links are live`,
                    bad ? "triangle-alert" : "check-check");
  }catch(e){
    if(!only) toast("Link check unavailable (deploy the site to use it)", "triangle-alert");
  }finally{
    urls.forEach(u => checking.delete(u));
    render();
  }
}
function paintDots(){
  document.querySelectorAll("[data-h]").forEach(el => {
    const u = el.dataset.h;
    if(checking.has(u)){ el.className = "hd-dot spin"; el.title = "Checking…"; return; }
    const h = hstate(u); el.className = "hd-dot " + h.cls; el.title = h.txt;
  });
}
function healthSummary(o){
  const u = allUrls(o);
  let ok = 0, bad = 0, un = 0;
  u.forEach(x => { const h = health[hkey(x)]; if(!h) un++; else if(h.ok) ok++; else bad++; });
  return { total:u.length, ok, bad, un };
}
/* auto-check the open org when the cache has gone stale */
function autoCheck(o){
  if(!o || cloud.mode !== "cloud") return;
  const stale = allUrls(o).filter(u => { const h = health[hkey(u)]; return !h || Date.now() - h.at > HTTL; });
  if(stale.length) checkLinks(o, stale);
}

function matches(o, q){
  if(!q) return true;
  return [o.name, o.notes, ...(o.tags || []),
    ...o.websites.map(w => w.label + " " + w.url),
    ...o.socials.map(s => platform(s.platform).name + " " + s.handle + " " + s.url + " " + (s.note || ""))
  ].join(" ").toLowerCase().includes(q);
}

      <main class="main" id="main"></main>
    </div>`;

  const rail = app.querySelector("#rail");
  rail.innerHTML = list.length ? list.map(o => {
    const h = healthSummary(o);
    return `<button class="oi ${o.id === selected ? "on" : ""}" data-org="${esc(o.id)}">
      ${logoBox(o)}
      <span style="min-width:0;flex:1">
        <span class="nm">${esc(o.name)}</span>
        <span class="sb">${o.websites.length} site${o.websites.length === 1 ? "" : "s"} · ${o.socials.length} channel${o.socials.length === 1 ? "" : "s"}</span>
      </span>
      ${h.bad ? `<span class="hd-dot bad" title="${h.bad} broken link(s)"></span>` : ""}
    </button>`; }).join("")
    : `<div class="empty" style="border:0;background:none;padding:26px 12px">
        <div class="e"><i data-lucide="${state.orgs.length ? "search-x" : "building-2"}"></i></div>
        <b>${state.orgs.length ? "No match" : "No organizations"}</b>
        ${state.orgs.length ? "Nothing found for “" + esc(query) + "”." : (unlocked ? "Click <b style='display:inline'>New</b> to add one." : "Unlock admin to add one.")}</div>`;
  rail.querySelectorAll("[data-org]").forEach(b => b.onclick = () => {
    selected = b.dataset.org;
    try{ history.replaceState(null, "", "#/" + selected); }catch(e){}
    render();
  });

  renderMain(org(selected), { tw, tc });
  icons(app); wireLogos(app); paintDots();

  if(!booting){
    anim(".oi", { x:-12, opacity:0, stagger:.025, duration:.3 });
    anim("#main > *", { y:16, opacity:0, stagger:.06, duration:.42 });
  }
}

function renderMain(o, tot){
  const m = document.getElementById("main");
  if(!m) return;

  const setupBanner = (cloud.mode === "local" && location.protocol.startsWith("http"))
    ? `<div class="note warn"><i data-lucide="cloud-off"></i><span><b>Not shared yet.</b> Data is saved only in
        this browser, so your phone and your teammates see nothing. Connect a free database to fix it.</span>
        <button class="b s p" id="setupB">Set up</button></div>` : "";

  if(!o){
    m.innerHTML = setupBanner + `<div class="card" style="padding:56px 24px">
      <div class="empty" style="border:0;background:none;padding:0">
        <div class="e"><i data-lucide="radio-tower"></i></div>
        <b style="font-size:19px">${state.orgs.length ? "Pick an organization" : "Nothing here yet"}</b>
        ${state.orgs.length ? "Choose one on the left to see its websites and channels."
          : (unlocked ? "Add your first organization to get started."
                      : "Press <b style='display:inline'>Admin</b> in the top-right to sign in and add one.")}
        ${!state.orgs.length && unlocked ? `<div style="margin-top:18px"><button class="b p xl" id="first">
          <i data-lucide="plus"></i> Add organization</button></div>` : ""}
      </div></div>`;
    icons(m);
    const b1 = m.querySelector("#first"); if(b1) b1.onclick = () => orgForm();
    const b2 = m.querySelector("#setupB"); if(b2) b2.onclick = setupModal;
    return;
  }

  const h = healthSummary(o);
  const hlab = h.total === 0 ? `<span style="color:var(--tx3)">nothing to check</span>`
    : h.bad ? `<span style="color:var(--red)"><b style="font-size:inherit">${h.bad}</b> need attention</span>`
    : h.un === h.total ? `<span style="color:var(--tx3)">not checked yet</span>`
    : `<span style="color:var(--grn)">all ${h.ok} live</span>`;

  const tools = key => unlocked ? `
    <span class="tb">
      <button class="b g i s" data-ed="${key}" title="Edit" data-fb="Edit"><i data-lucide="pencil"></i></button>
      <button class="b g i s d" data-rm="${key}" title="Remove" data-fb="Del"><i data-lucide="trash-2"></i></button>
    </span>` : "";

  const webTiles = o.websites.map(w => {
    const u = safeUrl(w.url);
    return `<div class="t" style="--c:hsl(${hue(w.label || w.url)} 62% 52%)">
      <div class="r1">
        <span class="lg sm"><img src="${esc(favicon(u, 64))}" alt="" loading="lazy">
          <span class="fb" style="background:${grad(w.label || w.url)}">${esc(initials(w.label || hostOf(u)))}</span></span>
        <span style="min-width:0;flex:1">
          <span class="nm">${esc(w.label || pretty(u))}</span>
          <span class="hd">${esc(hostOf(u))}</span>
        </span>
        <span class="hd-dot" data-h="${esc(u)}"></span>
      </div>
      <a class="lk" href="${esc(u)}" target="_blank" rel="noopener noreferrer">
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(pretty(u))}</span><i data-lucide="arrow-up-right"></i></a>
      ${unlocked ? tools("w:" + w.id) : `<div class="tb" style="opacity:1;transform:none">
        <button class="b g i s" data-cp="${esc(u)}" title="Copy" data-fb="Copy"><i data-lucide="copy"></i></button></div>`}
    </div>`;
  }).join("");

  const socTiles = o.socials.map(x => {
    const p = platform(x.platform), u = safeUrl(x.url);
    return `<div class="t" style="--c:${esc(p.color)}">
      <div class="r1">
        <span class="chip">${iconOf(p.icon, initials(p.name))}</span>
        <span style="min-width:0;flex:1">
          <span class="nm">${esc(p.name)}</span>
          <span class="hd">${esc(x.handle || pretty(u))}</span>
        </span>
        <span class="hd-dot" data-h="${esc(u)}"></span>
      </div>
      ${x.note ? `<div class="tag" style="margin-bottom:8px">${esc(x.note)}</div>` : ""}
      <a class="lk" href="${esc(u)}" target="_blank" rel="noopener noreferrer">
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(pretty(u))}</span><i data-lucide="arrow-up-right"></i></a>
      ${unlocked ? tools("s:" + x.id) : `<div class="tb" style="opacity:1;transform:none">
        <button class="b g i s" data-cp="${esc(u)}" title="Copy" data-fb="Copy"><i data-lucide="copy"></i></button></div>`}
    </div>`;
  }).join("");

  m.innerHTML = `
    ${setupBanner}
    ${unlocked ? "" : `<div class="note"><i data-lucide="lock"></i><span><b>Read-only view.</b>
      Nothing here can be added, changed or deleted without the admin password.</span></div>`}

    <div class="card hero">
      <div class="hero-top">
        ${logoBox(o, "xl")}
        <div style="flex:1;min-width:0">
          <h1>${esc(o.name)}</h1>
          <div style="color:var(--tx2);font-size:13px;font-weight:620">
            ${o.websites.length} website${o.websites.length === 1 ? "" : "s"} ·
            ${o.socials.length} social channel${o.socials.length === 1 ? "" : "s"}</div>
          ${o.tags.length ? `<div class="tags">${o.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          ${o.notes ? `<p class="notes">${esc(o.notes)}</p>` : ""}
        </div>
      </div>
      <div class="tools">
        <button class="b s" id="qr"><i data-lucide="qr-code"></i> QR code</button>
        <button class="b s" id="emb"><i data-lucide="code-xml"></i> Embed</button>
        <button class="b s" id="chk"><i data-lucide="link-2"></i> Check links</button>
        <button class="b s" id="cpall"><i data-lucide="copy"></i> Copy all</button>
        <span class="sp"></span>
        ${unlocked ? `<button class="b s" id="eo"><i data-lucide="pencil"></i> Edit org</button>
          <button class="b s d" id="do"><i data-lucide="trash-2"></i> Delete</button>` : ""}
      </div>
    </div>

    <div class="mrow">
      <div class="m"><b>${o.websites.length}</b><span>Websites</span></div>
      <div class="m"><b>${o.socials.length}</b><span>Social channels</span></div>
      <div class="m"><b>${tot.tw + tot.tc}</b><span>Links tracked (all orgs)</span>
        <div class="hl">${hlab}</div></div>
    </div>

    <div>
      <div class="sec-h"><h3><i data-lucide="globe"></i> Websites <span class="ct">${o.websites.length}</span></h3>
        ${unlocked ? `<button class="b p s" id="aw"><i data-lucide="plus"></i> Add website</button>` : ""}</div>
      ${o.websites.length ? `<div class="grid">${webTiles}</div>`
        : `<div class="empty"><div class="e"><i data-lucide="globe"></i></div><b>No websites yet</b>
           ${unlocked ? "Main site, blog, landing pages — add as many as you need." : "Nothing added yet."}</div>`}
    </div>

    <div>
      <div class="sec-h"><h3><i data-lucide="share-2"></i> Social channels <span class="ct">${o.socials.length}</span></h3>
        ${unlocked ? `<button class="b p s" id="as"><i data-lucide="plus"></i> Add channel</button>` : ""}</div>
      ${o.socials.length ? `<div class="grid">${socTiles}</div>`
        : `<div class="empty"><div class="e"><i data-lucide="share-2"></i></div><b>No social channels yet</b>
           ${unlocked ? "Instagram, Facebook, LinkedIn, YouTube — one tile per channel." : "Nothing added yet."}</div>`}
    </div>`;

  icons(m); wireLogos(m);

  const sb = m.querySelector("#setupB"); if(sb) sb.onclick = setupModal;
  m.querySelector("#qr").onclick = () => qrModal(o);
  m.querySelector("#emb").onclick = () => embedModal(o);
  m.querySelector("#chk").onclick = () => checkLinks(o);
  m.querySelector("#cpall").onclick = () => copy([
    o.name,
    ...o.websites.map(w => `${w.label || "Website"}: ${safeUrl(w.url)}`),
    ...o.socials.map(x => `${platform(x.platform).name}${x.handle ? " (" + x.handle + ")" : ""}: ${safeUrl(x.url)}`)
  ].join("\n"), "All links copied");
  m.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copy(b.dataset.cp, "Link copied"));

  if(!unlocked) return;
  m.querySelector("#eo").onclick = () => orgForm(o.id);
  m.querySelector("#do").onclick = async () => {
    if(!await confirmBox("Delete organization?",
      `<b>${esc(o.name)}</b> plus its ${o.websites.length} website(s) and ${o.socials.length} channel(s) will be removed.`)) return;
    state.orgs = state.orgs.filter(x => x.id !== o.id);
    selected = state.orgs.length ? state.orgs[0].id : null;
    await commit("Organization deleted", "trash-2");
  };
  m.querySelector("#aw").onclick = () => siteForm(o.id);
  m.querySelector("#as").onclick = () => socialForm(o.id);
  m.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
    const p = b.dataset.ed.split(":");
    p[0] === "w" ? siteForm(o.id, p[1]) : socialForm(o.id, p[1]);
  });
  m.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    const p = b.dataset.rm.split(":");
    if(p[0] === "w"){
      const w = o.websites.find(x => x.id === p[1]);
      if(!await confirmBox("Remove website?", `<b>${esc(w.label || pretty(w.url))}</b> will be removed from ${esc(o.name)}.`)) return;
      o.websites = o.websites.filter(x => x.id !== p[1]);
      await commit("Website removed", "trash-2");
    }else{
      const x = o.socials.find(y => y.id === p[1]);
      if(!await confirmBox("Remove channel?", `The <b>${esc(platform(x.platform).name)}</b> channel will be removed from ${esc(o.name)}.`)) return;
      o.socials = o.socials.filter(y => y.id !== p[1]);
      await commit("Channel removed", "trash-2");
    }
  });
}

/* ═══════════════════ boot ═══════════════════ */
document.getElementById("q").oninput = e => { query = e.target.value; render(); };
document.getElementById("lock").onclick = lockUI;
document.getElementById("set").onclick = () => unlocked ? settingsModal() : lockUI();
document.getElementById("thm").onclick = async () => {
  state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = state.settings.theme;
  if(unlocked) await persist(); else writeLocal();
  render();
};
document.getElementById("sync").onclick = () => cloud.mode === "cloud" ? settingsModal2() : setupModal();
function settingsModal2(){ unlocked ? settingsModal() : toast("Cloud storage connected · shared across devices", "cloud"); }
document.addEventListener("click", e => { if(e.target.closest("#new")) unlocked ? orgForm() : lockUI(); });
addEventListener("hashchange", () => {
  const id = (location.hash || "").replace(/^#\/?/, "");
  if(id && org(id)){ selected = id; render(); }
});

icons(document.body);

(async () => {
  try{ await pull(); }
  catch(e){ cloud.mode = "local"; state = readLocal(); }

  unlocked = false;                                   // always start locked
  sessionStorage.setItem("orghub.unlocked", "0");

  const hashId = (location.hash || "").replace(/^#\/?/, "");
  selected = (hashId && org(hashId)) ? hashId
           : (state.orgs.length ? state.orgs.slice().sort((a, b) => a.name.localeCompare(b.name))[0].id : null);

  booting = false;
  render();                     // render() owns the entrance animation — do not animate again here
  autoCheck(org(selected));
})();
})();
</script>
</body>
</html>
